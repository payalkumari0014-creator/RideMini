<script>

const API =
    "https://ridemini.onrender.com";

let driver = null;

let isOnline = false;

let locationWatch = null;

let requestInterval = null;

let activeRide = null;


// =================================
// PAGE LOAD
// =================================

window.onload = function(){

    const saved =
        localStorage.getItem(
            "ridemini_driver"
        );

    if(saved){

        try{

            driver =
                JSON.parse(saved);

            showDriver();

        }catch(error){

            localStorage.removeItem(
                "ridemini_driver"
            );

        }

    }

};


// =================================
// REGISTER DRIVER
// =================================

async function registerDriver(){

    const name =
        document.getElementById(
            "driverName"
        ).value.trim();

    const phone =
        document.getElementById(
            "driverPhone"
        ).value.trim();

    const vehicleType =
        document.getElementById(
            "vehicleType"
        ).value;

    const vehicleNumber =
        document.getElementById(
            "vehicleNumber"
        ).value
        .trim()
        .toUpperCase();


    if(!name){

        alert(
            "Please enter driver name"
        );

        return;

    }


    if(
        !/^[6-9][0-9]{9}$/.test(phone)
    ){

        alert(
            "Invalid Indian mobile number"
        );

        return;

    }


    if(!vehicleNumber){

        alert(
            "Please enter vehicle number"
        );

        return;

    }


    try{

        document.getElementById(
            "registerMessage"
        ).innerText =
            "Registering...";


        const response =
            await fetch(
                API +
                "/api/driver/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        name:name,

                        phone:phone,

                        vehicle_type:
                            vehicleType,

                        vehicle_number:
                            vehicleNumber

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Registration failed"
            );

        }


        driver =
            data.driver;


        localStorage.setItem(
            "ridemini_driver",
            JSON.stringify(driver)
        );


        showDriver();


    }catch(error){

        document.getElementById(
            "registerMessage"
        ).innerText =
            error.message ||
            "Registration failed";

        document.getElementById(
            "registerMessage"
        ).className =
            "error";

    }

}


// =================================
// SHOW DRIVER
// =================================

function showDriver(){

    document.getElementById(
        "registerSection"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "driverSection"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "displayName"
    ).innerText =
        driver.name;


    document.getElementById(
        "displayId"
    ).innerText =
        driver.id;


    document.getElementById(
        "displayVehicle"
    ).innerText =
        driver.vehicle_type;


    document.getElementById(
        "displayNumber"
    ).innerText =
        driver.vehicle_number;


    if(driver.online){

        setOnlineUI(true);

        startGPS();

        startRideRequests();

    }else{

        setOnlineUI(false);

    }


    loadHistory();

}


// =================================
// ONLINE / OFFLINE
// =================================

async function toggleOnline(){

    if(!driver){

        return;

    }


    const newStatus =
        !isOnline;


    try{

        const response =
            await fetch(
                API +
                "/api/driver/" +
                driver.id +
                "/status",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        online:
                            newStatus

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Unable to change status"
            );

        }


        isOnline =
            newStatus;


        driver.online =
            newStatus;


        localStorage.setItem(
            "ridemini_driver",
            JSON.stringify(driver)
        );


        setOnlineUI(
            newStatus
        );


        if(newStatus){

            startGPS();

            startRideRequests();

        }else{

            stopGPS();

            stopRideRequests();

        }


    }catch(error){

        alert(
            error.message ||
            "Unable to change status"
        );

    }

}


// =================================
// ONLINE UI
// =================================

function setOnlineUI(status){

    isOnline =
        status;


    const box =
        document.getElementById(
            "onlineStatus"
        );


    const button =
        document.getElementById(
            "onlineBtn"
        );


    if(status){

        box.className =
            "status online";

        box.innerText =
            "🟢 Online";

        button.innerText =
            "🔴 Go Offline";

    }else{

        box.className =
            "status offline";

        box.innerText =
            "🔴 Offline";

        button.innerText =
            "🟢 Go Online";

    }

}


// =================================
// GPS
// =================================

function startGPS(){

    if(!navigator.geolocation){

        document.getElementById(
            "gpsStatus"
        ).innerText =
            "GPS not supported";

        return;

    }


    if(locationWatch){

        return;

    }


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "📡 Starting GPS...";


    locationWatch =
        navigator.geolocation.watchPosition(

            function(position){

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                document.getElementById(
                    "gpsStatus"
                ).className =
                    "status online";


                document.getElementById(
                    "gpsStatus"
                ).innerText =
                    "📍 GPS Active";


                document.getElementById(
                    "coordinates"
                ).innerHTML =

                    "Latitude: <b>" +
                    lat.toFixed(6) +
                    "</b><br>" +

                    "Longitude: <b>" +
                    lng.toFixed(6) +
                    "</b>";


                sendLocation(
                    lat,
                    lng
                );

            },


            function(error){

                document.getElementById(
                    "gpsStatus"
                ).className =
                    "status offline";


                document.getElementById(
                    "gpsStatus"
                ).innerText =
                    "GPS permission required";

            },


            {
                enableHighAccuracy:true,

                maximumAge:2000,

                timeout:10000

            }

        );

}


// =================================
// STOP GPS
// =================================

function stopGPS(){

    if(locationWatch){

        navigator.geolocation.clearWatch(
            locationWatch
        );

        locationWatch = null;

    }


    document.getElementById(
        "gpsStatus"
    ).className =
        "status offline";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "Location stopped";

}


// =================================
// SEND LOCATION
// =================================

async function sendLocation(
    lat,
    lng
){

    if(!driver){

        return;

    }


    try{

        await fetch(
            API +
            "/api/driver/" +
            driver.id +
            "/location",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    lat:lat,

                    lng:lng

                })

            }
        );

    }catch(error){

        console.log(
            "Location error",
            error
        );

    }

}


// =================================
// RIDE REQUESTS
// =================================

function startRideRequests(){

    stopRideRequests();

    checkRideRequests();

    requestInterval =
        setInterval(
            checkRideRequests,
            3000
        );

}


// =================================
// STOP REQUESTS
// =================================

function stopRideRequests(){

    if(requestInterval){

        clearInterval(
            requestInterval
        );

        requestInterval = null;

    }

}


// =================================
// CHECK REQUESTS
// =================================

async function checkRideRequests(){

    if(!driver ||
       !isOnline){

        return;

    }


    try{

        const response =
            await fetch(
                API +
                "/api/driver/" +
                driver.id +
                "/requests"
            );


        const data =
            await response.json();


        if(!response.ok){

            return;

        }


        showRequests(
            data.rides || []
        );


    }catch(error){

        console.log(error);

    }

}


// =================================
// SHOW REQUESTS
// =================================

function showRequests(
    rides
){

    const box =
        document.getElementById(
            "requests"
        );


    if(!rides.length){

        box.innerHTML =
            "<p class='small'>" +
            "No new ride requests." +
            "</p>";

        return;

    }


    box.innerHTML = "";


    rides.forEach(
        function(ride){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ride";


            div.innerHTML =

                "<h3>🚕 New Ride</h3>" +

                "<p><b>Pickup:</b><br>" +
                ride.pickup +
                "</p><br>" +

                "<p><b>Drop:</b><br>" +
                ride.drop_location +
                "</p><br>" +

                "<p>💰 Fare: <b>₹" +
                (ride.fare || 0) +
                "</b></p>" +

                "<p>📏 Distance: " +
                (ride.distance_km || 0) +
                " km</p>" +

                "<div class='ride-buttons'>" +

                "<button class='black' " +
                "onclick=\"acceptRide(" +
                ride.id +
                ")\">" +

                "Accept" +

                "</button>" +

                "<button class='gray' " +
                "onclick=\"rejectRide(" +
                ride.id +
                ")\">" +

                "Reject" +

                "</button>" +

                "</div>";


            box.appendChild(
                div
            );

        }
    );

}

async function acceptRide(

){

                "/api/ride/" +

                "/accept",

                        driver_id:

        if(!response.ok){

            throw new Error(

                "Unable to accept ride"

        alert(
            error.message ||
            "Unable to accept ride"
        );

    }

}
