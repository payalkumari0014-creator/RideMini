<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RideMini Driver</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

.header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.profile{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.profile h2{
    margin-bottom:8px;
}

.onlineBox{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
}

.toggle{
    padding:10px 18px;
    border:0;
    border-radius:25px;
    background:#16a34a;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.toggle.off{
    background:#777;
}

.ride{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.ride h3{
    margin-bottom:15px;
}

.location{
    padding:10px;
    background:#f3f3f3;
    border-radius:10px;
    margin-bottom:8px;
}

.info{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
    font-weight:bold;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.accept{
    background:#111;
    color:white;
}

.reject{
    background:#eee;
    color:#111;
}

.start{
    background:#2563eb;
    color:white;
}

.complete{
    background:#16a34a;
    color:white;
}

.status{
    text-align:center;
    padding:15px;
    background:white;
    border-radius:15px;
    margin-bottom:18px;
}

.empty{
    text-align:center;
    padding:40px 15px;
    color:#777;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.requestTime{
    text-align:right;
    color:#888;
    font-size:12px;
    margin-bottom:10px;
}
</style>

</head>

<body>

<div class="header">
    🚕 RideMini Driver
</div>

<div class="container">

```
<div class="profile">

    <h2>👨‍✈️ Rahul Kumar</h2>

    <p>🏍️ Bike • JH01AB1234</p>

    <p>⭐ 4.8 Rating</p>

    <div class="onlineBox">

        <b id="onlineText">
            🟢 Online
        </b>

        <button
            class="toggle"
            id="onlineBtn"
            onclick="toggleOnline()">
            Go Offline
        </button>

    </div>

</div>


<div class="status" id="statusBox">
    🔎 Looking for ride requests...
</div>


<div id="rides">
    <div class="loading">
        🔎 Checking for rides...
    </div>
</div>
```

</div>

<script>

const BACKEND_URL =
    "https://ridemini.onrender.com";

const DRIVER_ID = 1;

let isOnline = true;

let activeRide = null;


/*
========================================
LOCAL REQUEST CACHE
========================================
*/

let pendingRides = new Map();

let lastSuccessfulServerCheck = Date.now();


/*
========================================
ONLINE / OFFLINE
========================================
*/

async function toggleOnline(){

    const newStatus = !isOnline;

    try{

        const response = await fetch(
            `${BACKEND_URL}/api/driver/${DRIVER_ID}/status`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    online:newStatus
                })
            }
        );

        const data = await response.json();

        if(!data.success){

            throw new Error(
                data.message || "Status update failed"
            );

        }

        isOnline = newStatus;

        updateOnlineUI();

        if(isOnline){

            loadRides();

        }

    }catch(error){

        console.log(
            "Driver status error:",
            error
        );

        alert(
            "Driver status update failed"
        );

    }
}


function updateOnlineUI(){

    const text =
        document.getElementById("onlineText");

    const button =
        document.getElementById("onlineBtn");


    if(isOnline){

        text.innerText =
            "🟢 Online";

        button.innerText =
            "Go Offline";

        button.classList.remove("off");

    }else{

        text.innerText =
            "⚫ Offline";

        button.innerText =
            "Go Online";

        button.classList.add("off");

        document.getElementById("rides").innerHTML = `
            <div class="empty">
                ⚫<br><br>
                You are offline
            </div>
        `;

        document.getElementById("statusBox").innerText =
            "⚫ You are offline";

    }

}


/*
========================================
LOAD RIDES
========================================
*/

async function loadRides(){

    if(!isOnline){

        return;

    }


    try{

        const response =
            await fetch(
                `${BACKEND_URL}/api/rides`,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server response error"
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                "Invalid server response"
            );

        }


        /*
        IMPORTANT:
        Server successfully replied.
        */

        lastSuccessfulServerCheck =
            Date.now();


        const serverRides =
            data.rides.filter(
                ride =>
                    ride.status === "searching" &&
                    ride.ride_type === "Bike"
            );


        /*
        Add / update rides in local cache
        */

        serverRides.forEach(
            ride => {

                pendingRides.set(
                    ride.id,
                    {
                        ...ride,
                        lastSeen:
                            Date.now()
                    }
                );

            }
        );


        /*
        Remove rides that server has
        explicitly changed from searching.
        */

        const serverRideMap =
            new Map(
                data.rides.map(
                    ride => [
                        ride.id,
                        ride
                    ]
                )
            );


        for(
            const [id, cachedRide]
            of pendingRides
        ){

            const serverRide =
                serverRideMap.get(id);


            if(
                serverRide &&
                serverRide.status !== "searching"
            ){

                pendingRides.delete(id);

            }

        }


        /*
        If server temporarily returns
        no searching rides, DON'T immediately
        delete our visible request.
        */

        renderRides(
            Array.from(
                pendingRides.values()
            )
        );


    }catch(error){

        console.log(
            "Ride loading error:",
            error
        );


        /*
        IMPORTANT FIX:

        Temporary server/network error
        ke time request ko remove nahi karenge.
        */

        if(pendingRides.size > 0){

            document.getElementById(
                "statusBox"
            ).innerText =
                "🔄 Reconnecting... Ride request محفوظ hai";

            renderRides(
                Array.from(
                    pendingRides.values()
                )
            );

        }else{

            document.getElementById(
                "statusBox"
            ).innerText =
                "🔄 Reconnecting to server...";

        }

    }

}


/*
========================================
SHOW RIDES
========================================
*/

function renderRides(rides){

    const box =
        document.getElementById("rides");


    /*
    ACTIVE RIDE
    */

    if(activeRide){

        return;

    }


    /*
    NO RIDES
    */

    if(rides.length === 0){

        box.innerHTML = `
            <div class="empty">
                🚕<br><br>
                No new ride requests
            </div>
        `;

        document.getElementById(
            "statusBox"
        ).innerText =
            "🔎 Waiting for ride requests...";

        return;

    }


    /*
    RIDES AVAILABLE
    */

    document.getElementById(
        "statusBox"
    ).innerText =
        `🚕 ${rides.length} new ride request${rides.length > 1 ? "s" : ""}`;


    box.innerHTML =
        rides.map(
            ride => `

        <div class="ride">

            <div class="requestTime">
                🔔 New request
            </div>

            <h3>
                🚕 New Ride #${ride.id}
            </h3>


            <div class="location">

                📍 <b>Pickup</b><br>

                ${escapeHTML(
                    ride.pickup
                )}

            </div>


            <div class="location">

                🏁 <b>Drop</b><br>

                ${escapeHTML(
                    ride.drop_location
                )}

            </div>


            <div class="info">

                <span>
                    📏 ${ride.distance_km} km
                </span>

                <span>
                    💰 ₹${ride.fare}
                </span>

            </div>


            <button
                class="accept"
                onclick="acceptRide(${ride.id})">

                ✅ Accept Ride

            </button>


            <button
                class="reject"
                onclick="rejectRide(${ride.id})">

                ❌ Reject

            </button>

        </div>

        `
        ).join("");

}


/*
========================================
ACCEPT RIDE
========================================
*/

async function acceptRide(rideId){

    try{

        /*
        Immediately stop showing
        duplicate request.
        */

        const response =
            await fetch(
                `${BACKEND_URL}/api/ride/${rideId}/accept`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        driver_id:DRIVER_ID
                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            alert(
                data.message ||
                "Ride accept failed"
            );

            loadRides();

            return;

        }


        /*
        Remove from pending list
        */

        pendingRides.delete(
            rideId
        );


        /*
        Set active ride
        */

        activeRide =
            data.ride;


        showActiveRide();


    }catch(error){

        console.log(
            "Accept error:",
            error
        );

        alert(
            "Ride accept failed. Internet/server check karo."
        );

    }

}


/*
========================================
ACTIVE RIDE
========================================
*/

function showActiveRide(){

    const box =
        document.getElementById("rides");


    box.innerHTML = `

        <div class="ride">

            <h3>
                ✅ Ride Accepted
            </h3>


            <div class="location">

                📍 <b>Pickup</b><br>

                ${escapeHTML(
                    activeRide.pickup
                )}

            </div>


            <div class="location">

                🏁 <b>Drop</b><br>

                ${escapeHTML(
                    activeRide.drop_location
                )}

            </div>


            <div class="info">

                <span>
                    📏 ${activeRide.distance_km} km
                </span>

                <span>
                    💰 ₹${activeRide.fare}
                </span>

            </div>


            <p
                style="
                    text-align:center;
                    margin:15px 0;
                ">

                🚗 Going to pickup location

            </p>


            <button
                class="start"
                onclick="startRide(${activeRide.id})">

                🏍️ Start Ride

            </button>

        </div>

    `;


    document.getElementById(
        "statusBox"
    ).innerText =
        "🚕 Ride accepted";

}


/*
========================================
START RIDE
========================================
*/

async function startRide(rideId){

    try{

        const response =
            await fetch(
                `${BACKEND_URL}/api/ride/${rideId}/start`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if(!data.success){

            alert(
                data.message ||
                "Ride start failed"
            );

            return;

        }


        activeRide =
            data.ride;


        showStartedRide();


    }catch(error){

        console.log(
            "Start error:",
            error
        );

        alert(
            "Ride start failed"
        );

    }

}


/*
========================================
STARTED RIDE
========================================
*/

function showStartedRide(){

    const box =
        document.getElementById("rides");


    box.innerHTML = `

        <div class="ride">

            <h3>
                🏍️ Ride Started
            </h3>


            <div class="location">

                📍 <b>Pickup</b><br>

                ${escapeHTML(
                    activeRide.pickup
                )}

            </div>


            <div class="location">

                🏁 <b>Drop</b><br>

                ${escapeHTML(
                    activeRide.drop_location
                )}

            </div>


            <div class="info">

                <span>
                    📏 ${activeRide.distance_km} km
                </span>

                <span>
                    💰 ₹${activeRide.fare}
                </span>

            </div>


            <p
                style="
                    text-align:center;
                    margin:15px 0;
                ">

                🏍️ Passenger ride in progress

            </p>


            <button
                class="complete"
                onclick="completeRide(${activeRide.id})">

                🏁 Complete Ride

            </button>

        </div>

    `;


    document.getElementById(
        "statusBox"
    ).innerText =
        "🏍️ Ride in progress";

}


/*
========================================
COMPLETE RIDE
========================================
*/

async function completeRide(rideId){

    try{

        const response =
            await fetch(
                `${BACKEND_URL}/api/ride/${rideId}/complete`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if(!data.success){

            alert(
                data.message ||
                "Ride complete failed"
            );

            return;

        }


        activeRide =
            null;


        document.getElementById(
            "statusBox"
        ).innerText =
            "🏁 Ride completed";


        document.getElementById(
            "rides"
        ).innerHTML = `

            <div class="empty">

                🏁<br><br>

                Ride completed successfully!

                <br><br>

                🔎 Waiting for next ride...

            </div>

        `;


        /*
        Immediately check for
        another ride.
        */

        setTimeout(
            loadRides,
            1000
        );


    }catch(error){

        console.log(
            "Complete error:",
            error
        );

        alert(
            "Ride complete failed"
        );

    }

}


/*
========================================
REJECT RIDE
========================================
*/

async function rejectRide(rideId){

    try{

        const response =
            await fetch(
                `${BACKEND_URL}/api/ride/${rideId}/reject`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        driver_id:DRIVER_ID
                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            alert(
                data.message ||
                "Reject failed"
            );

            return;

        }


        /*
        Remove only the rejected ride.
        */

        pendingRides.delete(
            rideId
        );


        renderRides(
            Array.from(
                pendingRides.values()
            )
        );


        loadRides();


    }catch(error){

        console.log(
            "Reject error:",
            error
        );

        alert(
            "Reject failed"
        );

    }

}


/*
========================================
SECURITY
========================================
*/

function escapeHTML(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
========================================
AUTO REFRESH
========================================
*/

setInterval(
    () => {

        if(
            isOnline &&
            !activeRide
        ){

            loadRides();

        }

    },
    3000
);


/*
========================================
FIRST LOAD
========================================
*/

updateOnlineUI();

loadRides();

</script>

</body>
</html>
