<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>RideMini Driver</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#111;
}

.container{
    max-width:500px;
    margin:auto;
    padding:18px;
}

.header{
    background:#111;
    color:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:15px;
}

.header h1{
    margin:0 0 6px;
}

.card{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.status{
    padding:12px;
    border-radius:12px;
    background:#eee;
    margin-top:10px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.online{
    background:#111;
    color:white;
}

.offline{
    background:#ddd;
    color:#111;
}

.accept{
    background:#111;
    color:white;
}

.reject{
    background:#ddd;
}

.start{
    background:#111;
    color:white;
}

.complete{
    background:#111;
    color:white;
}

.small{
    color:#666;
    font-size:13px;
}

.request{
    border:1px solid #ddd;
    border-radius:15px;
    padding:15px;
    margin-top:12px;
}

.active{
    border:2px solid #111;
}

.gps{
    background:#f7f7f7;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    word-break:break-all;
}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>🚕 RideMini Driver</h1>

<div>Driver ID: 1</div>

</div>


<div class="card">

<h2>Driver Status</h2>

<div id="status"
class="status">

🔴 Offline

</div>

<button
id="onlineBtn"
class="online"
onclick="toggleOnline()">

Go Online

</button>

</div>


<div class="card">

<h2>📍 Live GPS</h2>

<div
id="gps"
class="gps">

GPS waiting...

</div>

</div>


<div class="card">

<h2>🚕 Ride Requests</h2>

<div id="requests">

No ride requests

</div>

</div>


<div
id="activeRide"
class="card"
style="display:none;">

<h2>🚕 Active Ride</h2>

<div id="activeDetails"></div>

<button
class="start"
onclick="startRide()">

▶️ Start Ride

</button>

<button
class="complete"
onclick="completeRide()">

🏁 Complete Ride

</button>

</div>


</div>


<script>

const BACKEND_URL =
"https://ridemini.onrender.com";

const DRIVER_ID = 1;

let isOnline = false;

let watchId = null;

let activeRideId = null;

let pendingRides = new Map();


// ==================================
// ONLINE / OFFLINE
// ==================================

async function toggleOnline(){

    if(!isOnline){

        try{

            const response =
            await fetch(
                `${BACKEND_URL}/api/driver/${DRIVER_ID}/status`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        online:true
                    })
                }
            );

            const data =
            await response.json();

            if(data.success){

                isOnline = true;

                document.getElementById(
                    "status"
                ).innerHTML =
                "🟢 Online";

                document.getElementById(
                    "onlineBtn"
                ).innerHTML =
                "Go Offline";

                startGPS();

                alert(
                    "Driver Online + GPS Started 📍"
                );

            }

        }catch(error){

            alert(
                "Server connection error"
            );

        }

    }else{

        try{

            await fetch(
                `${BACKEND_URL}/api/driver/${DRIVER_ID}/status`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        online:false
                    })
                }
            );

        }catch(error){}

        isOnline = false;

        stopGPS();

        document.getElementById(
            "status"
        ).innerHTML =
        "🔴 Offline";

        document.getElementById(
            "onlineBtn"
        ).innerHTML =
        "Go Online";

    }

}


// ==================================
// GPS
// ==================================

function startGPS(){

    if(!navigator.geolocation){

        document.getElementById(
            "gps"
        ).innerHTML =
        "GPS supported nahi hai";

        return;

    }


    watchId =
    navigator.geolocation.watchPosition(

        async function(position){

            const lat =
            position.coords.latitude;

            const lng =
            position.coords.longitude;


            document.getElementById(
                "gps"
            ).innerHTML =

            `Latitude: ${lat}<br>
             Longitude: ${lng}<br>
             Accuracy: ${Math.round(
                position.coords.accuracy
             )} meters`;


            try{

                await fetch(
                    `${BACKEND_URL}/api/driver/${DRIVER_ID}/location`,
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":
                            "application/json"
                        },
                        body:JSON.stringify({
                            lat:lat,
                            lng:lng
                        })
                    }
                );

            }catch(error){

                console.log(
                    "GPS update failed",
                    error
                );

            }

        },

        function(error){

            document.getElementById(
                "gps"
            ).innerHTML =
            "❌ GPS permission/error";

        },

        {
            enableHighAccuracy:true,
            maximumAge:2000,
            timeout:10000
        }

    );

}


function stopGPS(){

    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }

}


// ==================================
// RIDE REQUEST POLLING
// ==================================

async function loadRequests(){

    if(!isOnline || activeRideId){

        return;

    }


    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/rides`
        );

        const data =
        await response.json();


        if(!data.success){

            return;

        }


        const searching =
        data.rides.filter(

            ride =>
            ride.status === "searching" &&
            ride.ride_type === getDriverType()

        );


        searching.forEach(
            ride => {
                pendingRides.set(
                    ride.id,
                    ride
                );
            }
        );


        renderRequests();

    }catch(error){

        console.log(
            "Request polling error",
            error
        );

    }

}


function getDriverType(){

    if(DRIVER_ID === 1)
        return "Bike";

    if(DRIVER_ID === 2)
        return "Auto";

    return "Cab";

}


function renderRequests(){

    const box =
    document.getElementById(
        "requests"
    );


    if(pendingRides.size === 0){

        box.innerHTML =
        "No ride requests";

        return;

    }


    box.innerHTML = "";


    pendingRides.forEach(
        ride => {

            box.innerHTML += `

            <div class="request">

                <h3>
                🚕 Ride #${ride.id}
                </h3>

                <p>
                📍 <b>Pickup:</b><br>
                ${ride.pickup}
                </p>

                <p>
                🏁 <b>Drop:</b><br>
                ${ride.drop_location}
                </p>

                <p>
                🚕 Type: ${ride.ride_type}
                </p>

                <p>
                💰 Fare: ₹${ride.fare}
                </p>

                <p>
                📏 Distance:
                ${ride.distance_km} km
                </p>

                <button
                class="accept"
                onclick="acceptRide(${ride.id})">

                ✅ Accept Ride

                </button>

                <button
                class="reject"
                onclick="rejectRide(${ride.id})">

                ❌ Reject

                </button>

            </div>

            `;

        }
    );

}


// ==================================
// ACCEPT
// ==================================

async function acceptRide(rideId){

    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${rideId}/accept`,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    driver_id:DRIVER_ID
                })
            }
        );


        const data =
        await response.json();


        if(data.success){

            activeRideId =
            rideId;

            pendingRides.clear();

            renderRequests();

            showActiveRide(
                data.ride
            );

            alert(
                "Ride accepted ✅"
            );

        }else{

            alert(
                data.message ||
                "Ride accept nahi hui"
            );

        }

    }catch(error){

        alert(
            "Server error"
        );

    }

}


// ==================================
// ACTIVE RIDE
// ==================================

function showActiveRide(ride){

    document.getElementById(
        "activeRide"
    ).style.display =
    "block";


    document.getElementById(
        "activeDetails"
    ).innerHTML = `

        <p>
        <b>Ride #${ride.id}</b>
        </p>

        <p>
        📍 ${ride.pickup}
        </p>

        <p>
        🏁 ${ride.drop_location}
        </p>

        <p>
        💰 ₹${ride.fare}
        </p>

        <p>
        Status:
        <b>${ride.status}</b>
        </p>

    `;

}


// ==================================
// START RIDE
// ==================================

async function startRide(){

    if(!activeRideId){

        return;

    }


    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${activeRideId}/start`,
            {
                method:"POST"
            }
        );


        const data =
        await response.json();


        if(data.success){

            showActiveRide(
                data.ride
            );

            alert(
                "🚕 Ride Started!\nCustomer ko live location dikh rahi hogi."
            );

        }else{

            alert(
                data.message
            );

        }

    }catch(error){

        alert(
            "Server error"
        );

    }

}


// ==================================
// COMPLETE RIDE
// ==================================

async function completeRide(){

    if(!activeRideId){

        return;

    }


    if(
        !confirm(
            "Ride complete karni hai?"
        )
    ){

        return;

    }


    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${activeRideId}/complete`,
            {
                method:"POST"
            }
        );


        const data =
        await response.json();


        if(data.success){

            alert(
                "🏁 Ride Completed!"
            );


            document.getElementById(
                "activeRide"
            ).style.display =
            "none";


            activeRideId = null;

            pendingRides.clear();

            renderRequests();

        }else{

            alert(
                data.message
            );

        }

    }catch(error){

        alert(
            "Server error"
        );

    }

}


// ==================================
// REJECT
// ==================================

async function rejectRide(rideId){

    try{

        await fetch(
            `${BACKEND_URL}/api/ride/${rideId}/reject`,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    driver_id:DRIVER_ID
                })
            }
        );

    }catch(error){}


    pendingRides.delete(
        rideId
    );

    renderRequests();

}


// ==================================
// AUTO POLLING
// ==================================

setInterval(
    loadRequests,
    3000
);


loadRequests();

</script>

</body>

</html>
