<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RideMini</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
}

.app{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    background:white;
    padding-bottom:30px;
}

.header{
    background:#111;
    color:white;
    padding:22px 20px;
    border-radius:0 0 25px 25px;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-top:6px;
    color:#bbb;
    font-size:14px;
}

.card{
    margin:16px;
    padding:18px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.location-wrap{
    position:relative;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
    margin-bottom:8px;
}

input:focus{
    border-color:#111;
}

.location-buttons{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.location-btn{
    flex:1;
    border:0;
    padding:12px 8px;
    border-radius:12px;
    background:#eee;
    font-weight:bold;
    cursor:pointer;
}

.suggestions{
    display:none;
    position:absolute;
    z-index:50;
    left:0;
    right:0;
    top:48px;
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    max-height:220px;
    overflow-y:auto;
}

.suggestion{
    padding:13px;
    border-bottom:1px solid #eee;
    font-size:13px;
    cursor:pointer;
}

.suggestion:last-child{
    border-bottom:0;
}

.suggestion:hover{
    background:#f5f5f5;
}

.selected-location{
    font-size:12px;
    color:#666;
    margin-bottom:12px;
    min-height:16px;
}

.map{
    height:180px;
    border-radius:18px;
    background:
        linear-gradient(45deg,#eee 25%,transparent 25%),
        linear-gradient(-45deg,#eee 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eee 75%),
        linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:40px 40px;
    background-position:0 0,0 20px,20px -20px,-20px 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:18px;
    color:#555;
    margin-bottom:15px;
    text-align:center;
    padding:15px;
}

.map-distance{
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
}

.route-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.route-btn:disabled{
    opacity:.6;
}

.vehicles{
    display:flex;
    gap:10px;
}

.vehicle{
    flex:1;
    padding:15px 8px;
    border:1px solid #ddd;
    border-radius:15px;
    background:white;
    cursor:pointer;
    text-align:center;
}

.vehicle.active{
    background:#111;
    color:white;
    border-color:#111;
}

.vehicle-icon{
    font-size:27px;
    display:block;
    margin-bottom:5px;
}

.vehicle-name{
    font-weight:bold;
    font-size:14px;
}

.fare{
    margin-top:18px;
    padding:16px;
    background:#f5f5f5;
    border-radius:15px;
}

.fare-row{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
}

.fare-total{
    font-size:21px;
    font-weight:bold;
    border-top:1px solid #ddd;
    padding-top:12px;
    margin-top:10px;
}

.coupon-box{
    display:flex;
    gap:8px;
}

.coupon-box input{
    margin:0;
}

.coupon-btn{
    border:0;
    background:#111;
    color:white;
    border-radius:12px;
    padding:0 18px;
    font-weight:bold;
}

.book-btn{
    width:calc(100% - 32px);
    margin:0 16px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    display:none;
    margin:16px;
    padding:20px;
    border-radius:20px;
    background:#111;
    color:white;
}

.status-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.loader{
    margin:15px 0;
    padding:13px;
    border-radius:12px;
    background:#222;
}

.driver{
    display:none;
    margin-top:15px;
    padding:16px;
    background:#222;
    border-radius:15px;
}

.driver-name{
    font-size:19px;
    font-weight:bold;
}

.driver-info{
    margin-top:7px;
    color:#ccc;
    line-height:1.7;
}

.driver-location{
    margin-top:12px;
    padding:12px;
    background:#333;
    border-radius:10px;
    color:#7CFF9B;
    font-size:12px;
}

.cancel-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:1px solid #555;
    border-radius:12px;
    background:transparent;
    color:white;
    cursor:pointer;
}

.success{
    color:#7CFF9B;
}

.error{
    color:#ff7777;
}

.loading{
    text-align:center;
    padding:15px;
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">🚕 RideMini</div>
    <div class="subtitle">Ride anywhere, anytime</div>
</div>


<!-- LOCATION -->

<div class="card">

    <label>📍 Pickup Location</label>

    <div class="location-wrap">

        <input
            id="pickup"
            type="text"
            placeholder="Search pickup location"
            autocomplete="off"
            oninput="searchLocation('pickup')"
        >

        <div
            class="suggestions"
            id="pickupSuggestions"
        ></div>

    </div>

    <div
        class="selected-location"
        id="pickupInfo"
    ></div>


    <div class="location-buttons">

        <button
            class="location-btn"
            onclick="useCurrentLocation('pickup')"
        >
            📍 Current Location
        </button>

        <button
            class="location-btn"
            onclick="clearLocation('pickup')"
        >
            ✏️ Manual
        </button>

    </div>


    <label>🏁 Destination</label>

    <div class="location-wrap">

        <input
            id="drop"
            type="text"
            placeholder="Search destination"
            autocomplete="off"
            oninput="searchLocation('drop')"
        >

        <div
            class="suggestions"
            id="dropSuggestions"
        ></div>

    </div>

    <div
        class="selected-location"
        id="dropInfo"
    ></div>


    <div class="location-buttons">

        <button
            class="location-btn"
            onclick="useCurrentLocation('drop')"
        >
            📍 Current Location
        </button>

        <button
            class="location-btn"
            onclick="clearLocation('drop')"
        >
            ✏️ Manual
        </button>

    </div>


    <div class="map">

        🗺️ Route Map

        <div
            class="map-distance"
            id="mapDistance"
        >
            Select pickup and destination
        </div>

    </div>


    <button
        class="route-btn"
        id="routeButton"
        onclick="calculateRoute()"
    >
        Calculate Route
    </button>

</div>


<!-- VEHICLES -->

<div class="card">

    <label>Select Ride</label>

    <div class="vehicles">

        <button
            class="vehicle active"
            id="bike"
            onclick="selectVehicle('Bike')"
        >
            <span class="vehicle-icon">🏍️</span>
            <span class="vehicle-name">Bike</span>
        </button>

        <button
            class="vehicle"
            id="auto"
            onclick="selectVehicle('Auto')"
        >
            <span class="vehicle-icon">🛺</span>
            <span class="vehicle-name">Auto</span>
        </button>

        <button
            class="vehicle"
            id="cab"
            onclick="selectVehicle('Cab')"
        >
            <span class="vehicle-icon">🚕</span>
            <span class="vehicle-name">Cab</span>
        </button>

    </div>


    <div class="fare">

        <div class="fare-row">
            <span>Distance</span>
            <strong id="distance">0 km</strong>
        </div>

        <div class="fare-row">
            <span>Fare Before Discount</span>
            <strong id="baseFare">₹0</strong>
        </div>

        <div class="fare-row">
            <span>Coupon Discount</span>
            <strong id="discount">₹0</strong>
        </div>

        <div class="fare-row fare-total">
            <span>Total</span>
            <strong id="totalFare">₹0</strong>
        </div>

    </div>

</div>


<!-- COUPON -->

<div class="card">

    <label>🎟️ Coupon Code</label>

    <div class="coupon-box">

        <input
            id="coupon"
            type="text"
            placeholder="Enter coupon"
        >

        <button
            class="coupon-btn"
            onclick="applyCoupon()"
        >
            Apply
        </button>

    </div>

</div>


<!-- BOOK -->

<button
    class="book-btn"
    onclick="bookRide()"
>
    🚕 Book Ride
</button>


<!-- STATUS -->

<div
    class="status"
    id="statusBox"
>

    <div
        class="status-title"
        id="statusTitle"
    >
        Searching for driver...
    </div>

    <div
        class="loader"
        id="statusMessage"
    >
        🔎 Finding nearby driver...
    </div>


    <div
        class="driver"
        id="driverBox"
    >

        <div
            class="driver-name"
            id="driverName"
        >
            Driver Found
        </div>

        <div
            class="driver-info"
            id="driverInfo"
        ></div>

        <div
            class="driver-location"
            id="driverLocation"
        >
            📍 Driver location waiting...
        </div>

    </div>


    <button
        class="cancel-btn"
        onclick="cancelRide()"
    >
        Cancel Ride
    </button>

</div>

</div>


<script>

/* =========================================
   BACKEND
========================================= */

const BACKEND_URL =
    "https://ridemini.onrender.com";


/* =========================================
   VARIABLES
========================================= */

let selectedVehicle = "Bike";

let distanceKm = 0;

let currentFare = 0;

let couponDiscount = 0;

let currentRideId = null;

let ridePolling = null;


/*
Location objects:

pickupLocation = {
    address: "...",
    lat: 23.x,
    lon: 86.x
}
*/

let pickupLocation = null;

let dropLocation = null;


/*
Prevent too many location requests
*/

let pickupSearchTimer = null;

let dropSearchTimer = null;


/* =========================================
   TELEGRAM
========================================= */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();
}


/* =========================================
   CURRENT LOCATION
========================================= */

function useCurrentLocation(type){

    if(!navigator.geolocation){

        alert(
            "Browser location support nahi karta."
        );

        return;
    }


    const input =
        document.getElementById(type);


    input.value =
        "📍 Getting current location...";


    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            try{

                /*
                Reverse geocoding:
                coordinates -> actual address
                */

                const response =
                    await fetch(
                        "https://nominatim.openstreetmap.org/reverse"
                        + "?format=json"
                        + "&lat=" + lat
                        + "&lon=" + lon
                        + "&zoom=18"
                        + "&addressdetails=1",
                        {
                            headers:{
                                "Accept-Language":"en"
                            }
                        }
                    );


                const data =
                    await response.json();


                const address =
                    data.display_name ||
                    "Current Location";


                const location = {

                    address:address,

                    lat:lat,

                    lon:lon
                };


                if(type === "pickup"){

                    pickupLocation =
                        location;

                    document
                        .getElementById("pickup")
                        .value =
                        address;

                    document
                        .getElementById("pickupInfo")
                        .innerText =
                        "📌 GPS: "
                        + lat.toFixed(6)
                        + ", "
                        + lon.toFixed(6);

                }
                else{

                    dropLocation =
                        location;

                    document
                        .getElementById("drop")
                        .value =
                        address;

                    document
                        .getElementById("dropInfo")
                        .innerText =
                        "📌 GPS: "
                        + lat.toFixed(6)
                        + ", "
                        + lon.toFixed(6);
                }


                alert(
                    "📍 Exact current location set ho gayi!"
                );


                /*
                If both locations already selected,
                automatically calculate route.
                */

                if(
                    pickupLocation &&
                    dropLocation
                ){

                    calculateRoute();
                }

            }
            catch(error){

                console.error(
                    "Reverse geocoding error:",
                    error
                );


                /*
                Even if address lookup fails,
                GPS coordinates are still usable.
                */

                const location = {

                    address:
                        "Current Location",

                    lat:lat,

                    lon:lon
                };


                if(type === "pickup"){

                    pickupLocation =
                        location;

                    document
                        .getElementById("pickup")
                        .value =
                        "Current Location";

                }
                else{

                    dropLocation =
                        location;

                    document
                        .getElementById("drop")
                        .value =
                        "Current Location";
                }


                alert(
                    "📍 Location set ho gayi, address lookup nahi ho paya."
                );
            }

        },

        function(error){

            console.error(error);


            document
                .getElementById(type)
                .value = "";


            if(error.code === 1){

                alert(
                    "Location permission allow karo."
                );

            }
            else{

                alert(
                    "Current location nahi mil paayi."
                );

            }

        },

        {
            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0
        }
    );
}


/* =========================================
   LOCATION SEARCH
========================================= */

function searchLocation(type){

    const input =
        document.getElementById(type);

    const query =
        input.value.trim();


    /*
    User manually type kar raha hai,
    old coordinates ko clear kar do.
    */

    if(type === "pickup"){

        pickupLocation = null;

        document
            .getElementById("pickupInfo")
            .innerText = "";

    }
    else{

        dropLocation = null;

        document
            .getElementById("dropInfo")
            .innerText = "";

    }


    if(query.length < 3){

        closeSuggestions(type);

        return;
    }


    if(type === "pickup"){

        clearTimeout(pickupSearchTimer);


        pickupSearchTimer =
            setTimeout(
                function(){

                    fetchLocationSuggestions(
                        type,
                        query
                    );

                },
                500
            );

    }
    else{

        clearTimeout(dropSearchTimer);


        dropSearchTimer =
            setTimeout(
                function(){

                    fetchLocationSuggestions(
                        type,
                        query
                    );

                },
                500
            );
    }
}


/* =========================================
   FETCH LOCATION SUGGESTIONS
========================================= */

async function fetchLocationSuggestions(
    type,
    query
){

    const box =
        document.getElementById(
            type + "Suggestions"
        );


    box.style.display =
        "block";


    box.innerHTML =
        '<div class="loading">🔎 Searching locations...</div>';


    try{

        /*
        India focused search.
        */

        const url =
            "https://nominatim.openstreetmap.org/search"
            + "?format=json"
            + "&q=" + encodeURIComponent(query)
            + "&countrycodes=in"
            + "&limit=6"
            + "&addressdetails=1";


        const response =
            await fetch(
                url,
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        const data =
            await response.json();


        box.innerHTML = "";


        if(!data.length){

            box.innerHTML =
                '<div class="loading">❌ Location nahi mili</div>';

            return;
        }


        data.forEach(
            function(place){

                const item =
                    document.createElement("div");


                item.className =
                    "suggestion";


                item.innerText =
                    place.display_name;


                item.onclick =
                    function(){

                        selectLocation(
                            type,
                            place
                        );

                    };


                box.appendChild(item);

            }
        );

    }
    catch(error){

        console.error(
            "Location search error:",
            error
        );


        box.innerHTML =
            '<div class="loading">❌ Search failed</div>';
    }
}


/* =========================================
   SELECT LOCATION
========================================= */

function selectLocation(
    type,
    place
){

    const location = {

        address:
            place.display_name,

        lat:
            Number(place.lat),

        lon:
            Number(place.lon)
    };


    if(type === "pickup"){

        pickupLocation =
            location;


        document
            .getElementById("pickup")
            .value =
            location.address;


        document
            .getElementById("pickupInfo")
            .innerText =
            "📌 Selected coordinates: "
            + location.lat.toFixed(6)
            + ", "
            + location.lon.toFixed(6);

    }
    else{

        dropLocation =
            location;


        document
            .getElementById("drop")
            .value =
            location.address;


        document
            .getElementById("dropInfo")
            .innerText =
            "📌 Selected coordinates: "
            + location.lat.toFixed(6)
            + ", "
            + location.lon.toFixed(6);

    }


    closeSuggestions(type);


    /*
    Automatically calculate if
    both exact locations are ready.
    */

    if(
        pickupLocation &&
        dropLocation
    ){

        calculateRoute();
    }
}


/* =========================================
   CLOSE SUGGESTIONS
========================================= */

function closeSuggestions(type){

    document
        .getElementById(
            type + "Suggestions"
        )
        .style.display =
        "none";
}


/* =========================================
   CLEAR LOCATION
========================================= */

function clearLocation(type){

    if(type === "pickup"){

        pickupLocation = null;

        document
            .getElementById("pickup")
            .value = "";

        document
            .getElementById("pickupInfo")
            .innerText = "";

    }
    else{

        dropLocation = null;

        document
            .getElementById("drop")
            .value = "";

        document
            .getElementById("dropInfo")
            .innerText = "";

    }


    distanceKm = 0;

    document
        .getElementById("distance")
        .innerText =
        "0 km";


    document
        .getElementById("mapDistance")
        .innerText =
        "Select pickup and destination";


    calculateFare();
}


/* =========================================
   CLICK OUTSIDE
========================================= */

document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".location-wrap"
            )
        ){

            closeSuggestions("pickup");

            closeSuggestions("drop");
        }

    }
);


/* =========================================
   VEHICLE
========================================= */

function selectVehicle(type){

    selectedVehicle =
        type;


    document
        .querySelectorAll(".vehicle")
        .forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(
            type.toLowerCase()
        )
        .classList.add(
            "active"
        );


    calculateFare();
}


/* =========================================
   ROUTE CALCULATION
========================================= */

async function calculateRoute(){

    /*
    Exact coordinates required.
    */

    if(
        !pickupLocation ||
        !dropLocation
    ){

        alert(
            "Pickup aur destination dono location suggestion se select karo ya Current Location use karo."
        );

        return;
    }


    const button =
        document.getElementById(
            "routeButton"
        );


    button.disabled = true;

    button.innerText =
        "🛣️ Calculating road route...";


    document
        .getElementById("mapDistance")
        .innerText =
        "Calculating actual road distance...";


    try{

        /*
        OSRM driving route.

        IMPORTANT:
        OSRM expects:
        longitude,latitude
        */

        const start =
            pickupLocation.lon
            + ","
            + pickupLocation.lat;


        const end =
            dropLocation.lon
            + ","
            + dropLocation.lat;


        const url =
            "https://router.project-osrm.org/route/v1/driving/"
            + start
            + ";"
            + end
            + "?overview=false";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Route server error"
            );
        }


        const data =
            await response.json();


        if(
            data.code !== "Ok" ||
            !data.routes ||
            !data.routes.length
        ){

            throw new Error(
                "Driving route nahi mili."
            );
        }


        /*
        OSRM distance is meters.
        */

        const meters =
            data.routes[0].distance;


        distanceKm =
            Math.round(
                (meters / 1000) * 10
            ) / 10;


        /*
        Very small route protection.
        */

        if(distanceKm < 0.1){

            distanceKm = 0.1;
        }


        document
            .getElementById("distance")
            .innerText =
            distanceKm.toFixed(1)
            + " km";


        document
            .getElementById("mapDistance")
            .innerText =
            "🛣️ Road Distance: "
            + distanceKm.toFixed(1)
            + " km";


        calculateFare();


        alert(
            "✅ Actual road distance: "
            + distanceKm.toFixed(1)
            + " km"
        );

    }
    catch(error){

        console.error(
            "Route error:",
            error
        );


        document
            .getElementById("mapDistance")
            .innerText =
            "❌ Route calculate nahi hua";


        alert(
            "Actual road route calculate nahi ho paya. Thodi der baad try karo."
        );

    }
    finally{

        button.disabled =
            false;

        button.innerText =
            "Calculate Route";
    }
}


/* =========================================
   FARE
========================================= */

function calculateFare(){

    let base = 0;

    let perKm = 0;


    if(
        selectedVehicle === "Bike"
    ){

        base = 40;

        perKm = 9;
    }


    if(
        selectedVehicle === "Auto"
    ){

        base = 60;

        perKm = 12;
    }


    if(
        selectedVehicle === "Cab"
    ){

        base = 100;

        perKm = 16;
    }


    let fare =
        base +
        (distanceKm * perKm);


    couponDiscount =
        Math.min(
            couponDiscount,
            fare
        );


    currentFare =
        Math.max(
            0,
            Math.round(
                fare -
                couponDiscount
            )
        );


    document
        .getElementById("baseFare")
        .innerText =
        "₹" +
        Math.round(fare);


    document
        .getElementById("discount")
        .innerText =
        "₹" +
        couponDiscount;


    document
        .getElementById("totalFare")
        .innerText =
        "₹" +
        currentFare;
}


/* =========================================
   COUPON
========================================= */

function applyCoupon(){

    const code =
        document
            .getElementById("coupon")
            .value
            .trim()
            .toUpperCase();


    couponDiscount = 0;


    if(
        code === "WELCOME50"
    ){

        couponDiscount = 50;

        alert(
            "🎉 WELCOME50 applied!"
        );

    }
    else if(
        code === "RIDE20"
    ){

        couponDiscount = 20;

        alert(
            "🎉 RIDE20 applied!"
        );

    }
    else if(
        code === "FIRST100"
    ){

        couponDiscount = 100;

        alert(
            "🎉 FIRST100 applied!"
        );

    }
    else if(code){

        alert(
            "❌ Invalid coupon"
        );
    }


    calculateFare();
}


/* =========================================
   BOOK RIDE
========================================= */

async function bookRide(){

    const pickup =
        document
            .getElementById("pickup")
            .value
            .trim();


    const drop =
        document
            .getElementById("drop")
            .value
            .trim();


    if(
        !pickup ||
        !drop
    ){

        alert(
            "Pickup aur destination enter karo."
        );

        return;
    }


    /*
    Exact coordinates compulsory.
    */

    if(
        !pickupLocation ||
        !dropLocation
    ){

        alert(
            "⚠️ Pickup aur destination suggestion se select karo ya Current Location button use karo."
        );

        return;
    }


    if(distanceKm <= 0){

        alert(
            "Pehle Calculate Route karo."
        );

        return;
    }


    const statusBox =
        document.getElementById(
            "statusBox"
        );


    statusBox.style.display =
        "block";


    document
        .getElementById("statusTitle")
        .innerText =
        "Searching for driver...";


    document
        .getElementById("statusMessage")
        .innerText =
        "🔎 Nearby "
        + selectedVehicle
        + " driver ko request bheji ja rahi hai...";


    document
        .getElementById("driverBox")
        .style.display =
        "none";


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ride",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        pickup:pickup,

                        drop_location:drop,

                        ride_type:
                            selectedVehicle,

                        distance_km:
                            distanceKm,

                        fare:
                            currentFare,

                        pickup_lat:
                            pickupLocation.lat,

                        pickup_lng:
                            pickupLocation.lon,

                        drop_lat:
                            dropLocation.lat,

                        drop_lng:
                            dropLocation.lon

                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Booking failed"
            );
        }


        currentRideId =
            data.ride_id;


        console.log(
            "Ride ID:",
            currentRideId
        );


        startRidePolling();

    }
    catch(error){

        console.error(error);


        document
            .getElementById("statusTitle")
            .innerText =
            "❌ Booking Failed";


        document
            .getElementById("statusMessage")
            .innerText =
            error.message;
    }
}


/* =========================================
   POLL RIDE STATUS
========================================= */

function startRidePolling(){

    if(ridePolling){

        clearInterval(
            ridePolling
        );
    }


    checkRideStatus();


    ridePolling =
        setInterval(
            checkRideStatus,
            3000
        );
}


/* =========================================
   CHECK RIDE
========================================= */

async function checkRideStatus(){

    if(!currentRideId){

        return;
    }


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ride/" +
                currentRideId
            );


        const data =
            await response.json();


        if(!data.success){

            return;
        }


        const ride =
            data.ride;


        console.log(
            "Ride:",
            ride
        );


        if(
            ride.status === "searching"
        ){

            document
                .getElementById("statusTitle")
                .innerText =
                "🔎 Searching for driver...";


            document
                .getElementById("statusMessage")
                .innerText =
                "Nearby "
                + ride.ride_type
                + " drivers ko request bheji gayi hai.";
        }


        if(
            ride.status === "accepted"
        ){

            showDriverFound(
                ride
            );

        }


        if(
            ride.status === "started"
        ){

            document
                .getElementById("statusTitle")
                .innerHTML =
                '<span class="success">🚕 Ride Started</span>';


            document
                .getElementById("statusMessage")
                .innerText =
                "Driver aapko destination tak le ja raha hai.";


            showDriverFound(
                ride
            );

        }


        if(
            ride.status === "completed"
        ){

            document
                .getElementById("statusTitle")
                .innerHTML =
                '<span class="success">✅ Ride Completed</span>';


            document
                .getElementById("statusMessage")
                .innerText =
                "Ride successfully complete ho gayi.";


            if(ridePolling){

                clearInterval(
                    ridePolling
                );
            }
        }


        if(
            ride.status === "rejected"
        ){

            document
                .getElementById("statusTitle")
                .innerText =
                "❌ Ride Rejected";


            document
                .getElementById("statusMessage")
                .innerText =
                "Driver ne ride request reject kar di.";


            if(ridePolling){

                clearInterval(
                    ridePolling
                );
            }
        }


        if(
            ride.status === "cancelled"
        ){

            document
                .getElementById("statusTitle")
                .innerText =
                "Ride Cancelled";


            document
                .getElementById("statusMessage")
                .innerText =
                "Ride cancel ho gayi.";


            if(ridePolling){

                clearInterval(
                    ridePolling
                );
            }
        }

    }
    catch(error){

        console.error(
            "Status error:",
            error
        );
    }
}


/* =========================================
   DRIVER FOUND
========================================= */

function showDriverFound(ride){

    document
        .getElementById("statusTitle")
        .innerHTML =
        '<span class="success">✅ Driver Found!</span>';


    document
        .getElementById("statusMessage")
        .innerText =
        "Driver aapki ride accept kar chuka hai.";


    const driver =
        ride.driver;


    if(!driver){

        document
            .getElementById("driverBox")
            .style.display =
            "block";


        document
            .getElementById("driverName")
            .innerText =
            "👨‍✈️ Driver Found";


        document
            .getElementById("driverInfo")
            .innerHTML =
            "Driver details loading...";


        return;
    }


    document
        .getElementById("driverBox")
        .style.display =
        "block";


    document
        .getElementById("driverName")
        .innerText =
        "👨‍✈️ " +
        (driver.name || "Driver");


    document
        .getElementById("driverInfo")
        .innerHTML =

        "🚗 Vehicle: " +
        (driver.vehicle_type || ride.ride_type || "N/A") +

        "<br>" +

        "🔢 Number: " +
        (driver.vehicle_number || "N/A") +

        "<br>" +

        "⭐ Rating: " +
        (driver.rating || "N/A");


    /*
    Driver GPS location.
    */

    const lat =
        driver.lat ??
        driver.latitude;


    const lng =
        driver.lng ??
        driver.longitude;


    if(
        lat !== undefined &&
        lng !== undefined
    ){

        document
            .getElementById("driverLocation")
            .innerHTML =

            "📍 Driver Live Location<br>"
            + "Latitude: "
            + Number(lat).toFixed(6)
            + "<br>"
            + "Longitude: "
            + Number(lng).toFixed(6);

    }
    else{

        document
            .getElementById("driverLocation")
            .innerText =
            "📍 Driver location waiting...";
    }


    /*
    Accepted ride ke baad
    polling continue rakhenge
    so GPS/status updates aa sakte hain.
    */

    if(!ridePolling){

        ridePolling =
            setInterval(
                checkRideStatus,
                3000
            );
    }
}


/* =========================================
   CANCEL
========================================= */

async function cancelRide(){

    if(!currentRideId){

        document
            .getElementById("statusBox")
            .style.display =
            "none";

        return;
    }


    try{

        await fetch(
            BACKEND_URL +
            "/api/ride/" +
            currentRideId +
            "/cancel",
            {
                method:"POST"
            }
        );

    }
    catch(error){

        console.error(
            error
        );
    }


    if(ridePolling){

        clearInterval(
            ridePolling
        );

        ridePolling = null;
    }


    currentRideId = null;


    document
        .getElementById("statusBox")
        .style.display =
        "none";


    alert(
        "Ride request cancel kar di gayi."
    );
}


/* =========================================
   INITIAL FARE
========================================= */

calculateFare();

</script>
