<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideMini</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
}

.app{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:18px;
}

.header{
    background:#111;
    color:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:7px 0 0;
    color:#bbb;
}

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h3{
    margin-top:0;
}

.location-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.location-row input{
    flex:1;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

.small-btn{
    border:none;
    background:#111;
    color:white;
    border-radius:10px;
    padding:0 12px;
    cursor:pointer;
}

.suggestions{
    margin-top:-5px;
    margin-bottom:10px;
}

.suggestion{
    padding:12px;
    background:#f5f5f5;
    border-bottom:1px solid #ddd;
    cursor:pointer;
    font-size:14px;
}

.suggestion:first-child{
    border-radius:10px 10px 0 0;
}

.suggestion:last-child{
    border-radius:0 0 10px 10px;
}

.map{
    height:230px;
    border-radius:16px;
    background:
        linear-gradient(35deg,transparent 46%,#bbb 47%,#bbb 50%,transparent 51%),
        linear-gradient(120deg,transparent 47%,#ccc 48%,#ccc 51%,transparent 52%),
        #e8e8e8;
    position:relative;
    overflow:hidden;
    margin-top:12px;
}

.map-title{
    position:absolute;
    top:12px;
    left:12px;
    background:white;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
}

.map-pin{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:35px;
}

.ride-options{
    display:flex;
    gap:8px;
}

.ride-btn{
    flex:1;
    padding:15px 5px;
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
}

.ride-btn.active{
    background:#111;
    color:white;
}

.route-btn,
.book-btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.route-btn:disabled,
.book-btn:disabled{
    opacity:.5;
}

.fare{
    font-size:30px;
    font-weight:bold;
}

.info{
    background:#f3f3f3;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    font-size:14px;
}

.status{
    padding:14px;
    border-radius:13px;
    background:#111;
    color:white;
    margin-bottom:10px;
    font-weight:bold;
}

.driver-box{
    background:#f5f5f5;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

.driver-name{
    font-size:20px;
    font-weight:bold;
}

.stars{
    display:flex;
    gap:5px;
    margin-top:10px;
}

.star{
    font-size:32px;
    cursor:pointer;
    color:#bbb;
}

.star.selected{
    color:#111;
}

.hidden{
    display:none!important;
}

.danger{
    background:#d33;
}

.success{
    background:#111;
}

.muted{
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <h1>🚕 RideMini</h1>
    <p>Book your ride easily</p>
</div>

<!-- LOCATION -->
<div class="card">

<h3>📍 Your Ride</h3>

<div class="location-row">
    <input id="pickup" placeholder="Pickup location">
    <button class="small-btn" onclick="usePickupLocation()">📍</button>
</div>

<div id="pickupSuggestions" class="suggestions"></div>

<div class="location-row">
    <input id="drop" placeholder="Where to?">
    <button class="small-btn" onclick="useDropLocation()">📍</button>
</div>

<div id="dropSuggestions" class="suggestions"></div>

<div id="locationInfo" class="info hidden"></div>

<div class="map">
    <div class="map-title">🗺️ RideMini Map</div>
    <div class="map-pin">📍</div>
</div>

<button class="route-btn" onclick="calculateRoute()">
    🛣️ Calculate Route
</button>

</div>


<!-- VEHICLE -->
<div class="card">

<h3>🚘 Choose Ride</h3>

<div class="ride-options">

<button class="ride-btn active" id="bikeBtn" onclick="selectRide('Bike')">
🏍️<br>Bike
</button>

<button class="ride-btn" id="autoBtn" onclick="selectRide('Auto')">
🛺<br>Auto
</button>

<button class="ride-btn" id="cabBtn" onclick="selectRide('Cab')">
🚕<br>Cab
</button>

</div>

</div>


<!-- FARE -->
<div class="card">

<h3>💰 Fare</h3>

<div class="fare" id="fare">
₹ --
</div>

<div id="distance">
Distance: --
</div>

</div>


<!-- COUPON -->
<div class="card">

<h3>🎟️ Coupon</h3>

<div class="location-row">
<input id="couponCode" placeholder="Enter coupon">
<button class="small-btn" onclick="applyCoupon()">Apply</button>
</div>

<div id="couponMessage"></div>

</div>


<!-- BOOK -->
<div class="card">

<button id="bookBtn" class="book-btn" onclick="bookRide()">
🚕 Book Ride
</button>

</div>


<!-- ACTIVE RIDE -->
<div id="rideCard" class="card hidden">

<h3>🚕 Current Ride</h3>

<div id="rideStatus" class="status">
Searching driver...
</div>

<div id="rideInfo"></div>

<div id="driverBox" class="driver-box hidden">

<div class="driver-name" id="driverName">
Driver
</div>

<div id="driverDetails"></div>

<div id="driverLocation"></div>

</div>

<button id="cancelBtn"
class="book-btn danger"
onclick="cancelRide()">
Cancel Ride
</button>

</div>


<!-- RATING -->
<div id="ratingCard" class="card hidden">

<h3>⭐ Rate your ride</h3>

<p>How was your ride?</p>

<div class="stars">

<span class="star" onclick="selectRating(1)">★</span>
<span class="star" onclick="selectRating(2)">★</span>
<span class="star" onclick="selectRating(3)">★</span>
<span class="star" onclick="selectRating(4)">★</span>
<span class="star" onclick="selectRating(5)">★</span>

</div>

<br>

<input id="review" placeholder="Write a review (optional)">

<button class="book-btn" onclick="submitRating()">
Submit Rating
</button>

</div>

</div>


<script>

const BACKEND_URL = "https://ridemini.onrender.com";

let selectedRide = "Bike";

let pickupLocation = null;
let dropLocation = null;

let distanceKm = 0;
let fareAmount = 0;
let discount = 0;

let activeRideId =
    localStorage.getItem("ridemini_active_ride");

let polling = null;

let selectedRating = 0;


/* =========================
   TELEGRAM
========================= */

try{

    if(window.Telegram &&
       Telegram.WebApp){

        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

    }

}catch(e){}


/* =========================
   RIDE SELECT
========================= */

function selectRide(type){

    selectedRide = type;

    document.querySelectorAll(".ride-btn")
    .forEach(btn => btn.classList.remove("active"));

    if(type === "Bike")
        document.getElementById("bikeBtn").classList.add("active");

    if(type === "Auto")
        document.getElementById("autoBtn").classList.add("active");

    if(type === "Cab")
        document.getElementById("cabBtn").classList.add("active");

    calculateFare();

}


/* =========================
   PICKUP GPS
========================= */

function usePickupLocation(){

    if(!navigator.geolocation){

        alert("Location supported nahi hai");
        return;

    }

    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            pickupLocation = {
                lat:lat,
                lon:lon
            };

            document.getElementById("pickup").value =
                "Current Location";

            try{

                const url =
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;

                const response = await fetch(url,{
                    headers:{
                        "Accept":"application/json"
                    }
                });

                const data = await response.json();

                if(data.display_name){

                    document.getElementById("pickup").value =
                        data.display_name;

                    pickupLocation.address =
                        data.display_name;

                }

            }catch(e){}

        },

        () => {

            alert("Location permission allow karo");

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}


/* =========================
   DROP GPS
========================= */

function useDropLocation(){

    if(!navigator.geolocation){

        alert("Location supported nahi hai");
        return;

    }

    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            dropLocation = {
                lat:lat,
                lon:lon
            };

            document.getElementById("drop").value =
                "Current Location";

            try{

                const url =
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;

                const response = await fetch(url,{
                    headers:{
                        "Accept":"application/json"
                    }
                });

                const data = await response.json();

                if(data.display_name){

                    document.getElementById("drop").value =
                        data.display_name;

                    dropLocation.address =
                        data.display_name;

                }

            }catch(e){}

        },

        () => {

            alert("Location permission allow karo");

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}


/* =========================
   LOCATION SEARCH
========================= */

let searchTimers = {};


/* PICKUP SEARCH */

document.getElementById("pickup")
.addEventListener("input",function(){

    const value = this.value.trim();

    pickupLocation = null;

    clearTimeout(searchTimers.pickup);

    if(value.length < 3){

        document.getElementById(
            "pickupSuggestions"
        ).innerHTML = "";

        return;

    }

    searchTimers.pickup =
    setTimeout(() => {

        searchLocation(
            value,
            "pickup"
        );

    },500);

});


/* DROP SEARCH */

document.getElementById("drop")
.addEventListener("input",function(){

    const value = this.value.trim();

    dropLocation = null;

    clearTimeout(searchTimers.drop);

    if(value.length < 3){

        document.getElementById(
            "dropSuggestions"
        ).innerHTML = "";

        return;

    }

    searchTimers.drop =
    setTimeout(() => {

        searchLocation(
            value,
            "drop"
        );

    },500);

});


async function searchLocation(query,type){

    try{

        const url =
        `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&q=${encodeURIComponent(query)}`;

        const response = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        const results = await response.json();

        const box =
            document.getElementById(
                type === "pickup"
                ? "pickupSuggestions"
                : "dropSuggestions"
            );

        box.innerHTML = "";

        results.forEach(place => {

            const div =
            document.createElement("div");

            div.className = "suggestion";

            div.textContent =
                place.display_name;

            div.onclick = () => {

                const location = {

                    lat:Number(place.lat),

                    lon:Number(place.lon),

                    address:place.display_name

                };

                if(type === "pickup"){

                    pickupLocation = location;

                    document.getElementById("pickup")
                    .value =
                    place.display_name;

                    document.getElementById(
                        "pickupSuggestions"
                    ).innerHTML = "";

                }else{

                    dropLocation = location;

                    document.getElementById("drop")
                    .value =
                    place.display_name;

                    document.getElementById(
                        "dropSuggestions"
                    ).innerHTML = "";

                }

            };

            box.appendChild(div);

        });

    }catch(e){

        console.log("Search error",e);

    }

}


/* =========================
   ROUTE
========================= */

async function calculateRoute(){

    if(!pickupLocation ||
       !dropLocation){

        alert(
            "Pickup aur Drop dono select karo."
        );

        return;

    }

    try{

        const url =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${pickupLocation.lon},${pickupLocation.lat};` +
        `${dropLocation.lon},${dropLocation.lat}` +
        `?overview=false`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        if(!data.routes ||
           !data.routes.length){

            alert("Route nahi mila");
            return;

        }

        distanceKm =
            data.routes[0].distance / 1000;

        distanceKm =
            Math.round(distanceKm * 10) / 10;

        document.getElementById("distance")
        .textContent =
        `Distance: ${distanceKm} km`;

        calculateFare();

        document.getElementById("locationInfo")
        .classList.remove("hidden");

        document.getElementById("locationInfo")
        .innerHTML =
        `📍 Pickup selected<br>
         🏁 Drop selected<br>
         🛣️ Road distance: ${distanceKm} km`;

    }catch(e){

        console.log(e);

        alert(
            "Route calculate nahi ho pa raha."
        );

    }

}


/* =========================
   FARE
========================= */

function calculateFare(){

    if(!distanceKm){

        fareAmount = 0;

        document.getElementById("fare")
        .textContent = "₹ --";

        return;

    }

    if(selectedRide === "Bike"){

        fareAmount =
            40 + (distanceKm * 9);

    }

    if(selectedRide === "Auto"){

        fareAmount =
            60 + (distanceKm * 12);

    }

    if(selectedRide === "Cab"){

        fareAmount =
            100 + (distanceKm * 16);

    }

    fareAmount =
        Math.max(
            0,
            Math.round(fareAmount - discount)
        );

    document.getElementById("fare")
    .textContent =
    `₹ ${fareAmount}`;

}


/* =========================
   COUPON
========================= */

function applyCoupon(){

    const code =
        document.getElementById("couponCode")
        .value
        .trim()
        .toUpperCase();

    discount = 0;

    if(code === "WELCOME50"){

        discount = 50;

        document.getElementById("couponMessage")
        .textContent =
        "✅ ₹50 discount applied";

    }
    else if(code === "RIDE20"){

        discount = 20;

        document.getElementById("couponMessage")
        .textContent =
        "✅ ₹20 discount applied";

    }
    else if(code === "FIRST100"){

        discount = 100;

        document.getElementById("couponMessage")
        .textContent =
        "✅ ₹100 discount applied";

    }
    else{

        document.getElementById("couponMessage")
        .textContent =
        "❌ Invalid coupon";

    }

    calculateFare();

}


/* =========================
   BOOK RIDE
========================= */

async function bookRide(){

    if(!pickupLocation){

        alert("Pickup select karo.");
        return;

    }

    if(!dropLocation){

        alert("Drop select karo.");
        return;

    }

    if(!distanceKm){

        alert("Pehle Calculate Route dabao.");
        return;

    }

    const button =
        document.getElementById("bookBtn");

    button.disabled = true;

    button.textContent =
        "⏳ Booking...";

    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    pickup:
                        pickupLocation.address ||
                        document.getElementById("pickup").value,

                    drop_location:
                        dropLocation.address ||
                        document.getElementById("drop").value,

                    ride_type:selectedRide,

                    distance_km:distanceKm,

                    fare:fareAmount,

                    pickup_lat:pickupLocation.lat,

                    pickup_lng:pickupLocation.lon,

                    drop_lat:dropLocation.lat,

                    drop_lng:dropLocation.lon

                })

            }
        );

        const data =
            await response.json();

        console.log("BOOK RESPONSE:",data);

        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Booking failed"
            );

        }

        activeRideId =
            String(data.ride_id);

        /*
        IMPORTANT:
        Ride ID browser me save ho raha hai.
        Refresh ke baad isi ID se ride
        dobara load hogi.
        */

        localStorage.setItem(
            "ridemini_active_ride",
            activeRideId
        );

        saveCustomerState();

        document.getElementById("rideCard")
        .classList.remove("hidden");

        button.textContent =
            "🚕 Ride Requested";

        button.disabled = true;

        showRideStatus(
            "searching"
        );

        startPolling();

    }catch(error){

        console.log(error);

        alert(
            "Ride request nahi ja rahi: " +
            error.message
        );

        button.disabled = false;

        button.textContent =
            "🚕 Book Ride";

    }

}


/* =========================
   SAVE CUSTOMER STATE
========================= */

function saveCustomerState(){

    const state = {

        pickup:
            document.getElementById("pickup").value,

        drop:
            document.getElementById("drop").value,

        pickupLocation,

        dropLocation,

        selectedRide,

        distanceKm,

        fareAmount,

        discount

    };

    localStorage.setItem(
        "ridemini_customer_state",
        JSON.stringify(state)
    );

}


/* =========================
   RESTORE CUSTOMER STATE
========================= */

function restoreCustomerState(){

    try{

        const saved =
            localStorage.getItem(
                "ridemini_customer_state"
            );

        if(saved){

            const state =
                JSON.parse(saved);

            document.getElementById("pickup")
            .value =
                state.pickup || "";

            document.getElementById("drop")
            .value =
                state.drop || "";

            pickupLocation =
                state.pickupLocation || null;

            dropLocation =
                state.dropLocation || null;

            selectedRide =
                state.selectedRide || "Bike";

            distanceKm =
                Number(state.distanceKm) || 0;

            fareAmount =
                Number(state.fareAmount) || 0;

            discount =
                Number(state.discount) || 0;

            selectRide(selectedRide);

            if(distanceKm){

                document.getElementById("distance")
                .textContent =
                `Distance: ${distanceKm} km`;

                calculateFare();

            }

        }

        if(activeRideId){

            document.getElementById("rideCard")
            .classList.remove("hidden");

            document.getElementById("bookBtn")
            .textContent =
            "🚕 Ride Active";

            document.getElementById("bookBtn")
            .disabled = true;

            /*
            Refresh ke baad server se
            actual ride dobara fetch hogi.
            */

            loadRide();

        }

    }catch(e){

        console.log(
            "Restore error:",
            e
        );

    }

}


/* =========================
   RIDE POLLING
========================= */

function startPolling(){

    if(polling)
        clearInterval(polling);

    loadRide();

    polling =
        setInterval(
            loadRide,
            2000
        );

}


async function loadRide(){

    if(!activeRideId)
        return;

    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${activeRideId}`,
            {
                cache:"no-store"
            }
        );

        if(response.status === 404){

            console.log(
                "Ride server par nahi mili"
            );

            return;

        }

        const data =
            await response.json();

        if(!data.success ||
           !data.ride){

            return;

        }

        const ride =
            data.ride;

        /*
        Server se latest ride state
        browser me save kar do.
        */

        localStorage.setItem(
            "ridemini_last_ride",
            JSON.stringify(ride)
        );

        updateRideUI(ride);

    }catch(e){

        console.log(
            "Ride polling error:",
            e
        );

    }

}


/* =========================
   RIDE UI
========================= */

function updateRideUI(ride){

    showRideStatus(
        ride.status
    );

    let info = "";

    info +=
    `<div class="info">
        🆔 Ride ID: ${ride.id}<br>
        🏍️ Ride: ${ride.ride_type}<br>
        📏 Distance: ${ride.distance_km || 0} km<br>
        💰 Fare: ₹${ride.fare || 0}
    </div>`;

    document.getElementById("rideInfo")
    .innerHTML = info;


    if(
        ride.driver_name ||
        ride.driver_id
    ){

        document.getElementById("driverBox")
        .classList.remove("hidden");

        document.getElementById("driverName")
        .textContent =
        "👨‍✈️ " +
        (ride.driver_name ||
        "Driver Assigned");

        let details = "";

        if(ride.vehicle_number){

            details +=
            `🚘 Vehicle: ${ride.vehicle_number}<br>`;

        }

        if(ride.driver_rating){

            details +=
            `⭐ Rating: ${ride.driver_rating}<br>`;

        }

        if(ride.ride_type){

            details +=
            `🚕 Type: ${ride.ride_type}`;

        }

        document.getElementById(
            "driverDetails"
        ).innerHTML = details;

    }


    if(
        ride.driver_lat !== undefined &&
        ride.driver_lng !== undefined &&
        ride.driver_lat !== null &&
        ride.driver_lng !== null
    ){

        document.getElementById(
            "driverLocation"
        ).innerHTML =
        `<br>
        🟢 LIVE DRIVER LOCATION<br>
        Latitude: ${ride.driver_lat}<br>
        Longitude: ${ride.driver_lng}<br>
        <a target="_blank"
        href="https://www.openstreetmap.org/?mlat=${ride.driver_lat}&mlon=${ride.driver_lng}#map=17/${ride.driver_lat}/${ride.driver_lng}">
        📍 Open Live Location
        </a>`;

    }


    if(ride.status === "completed"){

        document.getElementById(
            "cancelBtn"
        ).classList.add("hidden");

        document.getElementById(
            "ratingCard"
        ).classList.remove("hidden");

        if(polling){

            clearInterval(polling);
            polling = null;

        }

    }


    if(ride.status === "cancelled"){

        document.getElementById(
            "cancelBtn"
        ).classList.add("hidden");

    }


    /*
    State ko continuously save karo.
    Refresh ke baad ye details restore hongi.
    */

    saveCustomerState();

}


/* =========================
   STATUS
========================= */

function showRideStatus(status){

    const box =
        document.getElementById(
            "rideStatus"
        );

    if(status === "searching"){

        box.textContent =
        "🔎 Searching for driver...";

    }
    else if(status === "accepted"){

        box.textContent =
        "✅ Driver accepted your ride";

    }
    else if(status === "driver_arriving"){

        box.textContent =
        "🚗 Driver is coming to pickup";

    }
    else if(status === "started"){

        box.textContent =
        "🟢 RIDE STARTED — Live location ON";

    }
    else if(status === "completed"){

        box.textContent =
        "🏁 RIDE COMPLETED";

    }
    else if(status === "cancelled"){

        box.textContent =
        "❌ RIDE CANCELLED";

    }
    else{

        box.textContent =
        "🚕 Ride status: " + status;

    }

}


/* =========================
   CANCEL
========================= */

async function cancelRide(){

    if(!activeRideId)
        return;

    if(!confirm(
        "Ride cancel karna hai?"
    ))
        return;

    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${activeRideId}/cancel`,
            {
                method:"POST"
            }
        );

        const data =
            await response.json();

        if(data.success){

            showRideStatus(
                "cancelled"
            );

            localStorage.removeItem(
                "ridemini_active_ride"
            );

            activeRideId = null;

            if(polling){

                clearInterval(polling);
                polling = null;

            }

            document.getElementById(
                "cancelBtn"
            ).classList.add("hidden");

        }

    }catch(e){

        alert(
            "Cancel nahi hua."
        );

    }

}


/* =========================
   RATING
========================= */

function selectRating(rating){

    selectedRating = rating;

    document.querySelectorAll(
        ".star"
    ).forEach(
        (star,index) => {

            star.classList.toggle(
                "selected",
                index < rating
            );

        }
    );

}


async function submitRating(){

    if(!activeRideId){

        alert("Ride ID nahi mili.");
        return;

    }

    if(!selectedRating){

        alert(
            "Pehle stars select karo."
        );

        return;

    }

    const review =
        document.getElementById(
            "review"
        ).value;

    try{

        const response =
        await fetch(
            `${BACKEND_URL}/api/ride/${activeRideId}/rating`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    rating:selectedRating,

                    review:review

                })

            }
        );

        const data =
            await response.json();

        if(data.success){

            alert(
                "⭐ Rating submitted!"
            );

            localStorage.removeItem(
                "ridemini_active_ride"
            );

            activeRideId = null;

            document.getElementById(
                "ratingCard"
            ).innerHTML =
            `<h3>⭐ Thank you!</h3>
             <p>Your rating has been submitted.</p>`;

        }else{

            alert(
                data.message ||
                "Rating submit nahi hui."
            );

        }

    }catch(e){

        console.log(e);

        alert(
            "Rating submit error."
        );

    }

}


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
    "load",
    () => {

        restoreCustomerState();

    }
);

</script>
