<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RideMini</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f3f3;
    color:#111;
}

.app{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

.header{
    background:#111;
    color:#fff;
    padding:22px 20px;
    border-radius:0 0 25px 25px;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-top:6px;
    color:#bbb;
    font-size:14px;
}

.content{
    padding:18px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.label{
    font-size:13px;
    color:#777;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

.location-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.location-row button{
    flex:1;
}

button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:bold;
}

.location-btn{
    background:#eee;
    color:#111;
}

.route-btn{
    width:100%;
    background:#111;
    color:#fff;
    margin-top:12px;
}

.map{
    height:230px;
    border-radius:18px;
    margin-top:15px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(30deg,transparent 48%,#ddd 49%,#ddd 51%,transparent 52%),
        linear-gradient(120deg,transparent 48%,#ddd 49%,#ddd 51%,transparent 52%),
        #f5f5f5;
}

.road{
    position:absolute;
    width:100%;
    height:5px;
    background:#ccc;
    top:50%;
    transform:rotate(-12deg);
}

.road2{
    position:absolute;
    width:100%;
    height:5px;
    background:#ccc;
    top:32%;
    transform:rotate(18deg);
}

.map-title{
    position:absolute;
    top:15px;
    left:15px;
    background:#fff;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.marker{
    position:absolute;
    font-size:28px;
}

.pickup-marker{
    left:25%;
    top:58%;
}

.drop-marker{
    right:20%;
    top:27%;
}

.ride-types{
    display:flex;
    gap:10px;
}

.ride{
    flex:1;
    background:#f1f1f1;
    padding:15px 5px;
    text-align:center;
    border-radius:14px;
    border:2px solid transparent;
}

.ride.active{
    border-color:#111;
    background:#fff;
}

.ride-icon{
    font-size:27px;
}

.ride-name{
    margin-top:6px;
    font-weight:bold;
    font-size:14px;
}

.fare-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f5f5f5;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
}

.fare{
    font-size:24px;
    font-weight:bold;
}

.distance{
    color:#666;
    font-size:13px;
}

.coupon-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.coupon-row input{
    flex:1;
}

.coupon-btn{
    background:#111;
    color:#fff;
}

.book-btn{
    width:100%;
    background:#111;
    color:#fff;
    padding:17px;
    font-size:17px;
    margin-top:15px;
}

.book-btn:disabled{
    background:#999;
}

.status{
    display:none;
    text-align:center;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
    background:#f1f1f1;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top:4px solid #111;
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.driver-card{
    display:none;
    margin-top:15px;
    padding:18px;
    border-radius:18px;
    background:#111;
    color:#fff;
}

.driver-title{
    font-size:13px;
    color:#aaa;
    margin-bottom:10px;
}

.driver-name{
    font-size:22px;
    font-weight:bold;
}

.driver-info{
    margin-top:8px;
    color:#ddd;
    line-height:1.7;
}

.success{
    background:#e9ffe9;
    color:#146b14;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
    font-weight:bold;
}

.error{
    background:#ffe9e9;
    color:#9b111e;
    padding:10px;
    border-radius:10px;
    margin-top:12px;
}

.small{
    font-size:12px;
    color:#777;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">RideMini</div>
        <div class="subtitle">Book your ride easily</div>
    </div>

    <div class="content">

        <div class="card">

            <div class="label">Pickup location</div>

            <input
                id="pickup"
                type="text"
                placeholder="Enter pickup location"
            >

            <div class="location-row">
                <button
                    class="location-btn"
                    onclick="useMyLocation()"
                >
                    Use My Location
                </button>
            </div>

            <br>

            <div class="label">Drop location</div>

            <input
                id="drop"
                type="text"
                placeholder="Where do you want to go?"
            >

            <button
                class="route-btn"
                onclick="calculateRoute()"
            >
                Calculate Distance
            </button>

            <div class="map">

                <div class="map-title">
                    RideMini Map
                </div>

                <div class="road"></div>
                <div class="road2"></div>

                <div
                    class="marker pickup-marker"
                >
                    📍
                </div>

                <div
                    class="marker drop-marker"
                >
                    🏁
                </div>

            </div>

        </div>


        <div class="card">

            <div class="label">
                Choose ride
            </div>

            <div class="ride-types">

                <div
                    class="ride active"
                    onclick="selectRide('Bike',this)"
                >
                    <div class="ride-icon">🏍️</div>
                    <div class="ride-name">Bike</div>
                </div>

                <div
                    class="ride"
                    onclick="selectRide('Auto',this)"
                >
                    <div class="ride-icon">🛺</div>
                    <div class="ride-name">Auto</div>
                </div>

                <div
                    class="ride"
                    onclick="selectRide('Cab',this)"
                >
                    <div class="ride-icon">🚕</div>
                    <div class="ride-name">Cab</div>
                </div>

            </div>


            <div class="fare-box">

                <div>
                    <div class="distance">
                        Distance
                    </div>

                    <div id="distance">
                        0 km
                    </div>
                </div>

                <div>
                    <div class="distance">
                        Estimated Fare
                    </div>

                    <div
                        class="fare"
                        id="fare"
                    >
                        ₹0
                    </div>
                </div>

            </div>

        </div>


        <div class="card">

            <div class="label">
                Coupon code
            </div>

            <div class="coupon-row">

                <input
                    id="coupon"
                    type="text"
                    placeholder="WELCOME50"
                >

                <button
                    class="coupon-btn"
                    onclick="applyCoupon()"
                >
                    Apply
                </button>

            </div>

            <div
                id="couponMessage"
                class="small"
            ></div>

        </div>


        <div class="card">

            <button
                id="bookBtn"
                class="book-btn"
                onclick="bookRide()"
            >
                Book Ride
            </button>

            <div
                id="errorBox"
                class="error"
                style="display:none;"
            ></div>


            <div
                id="searchStatus"
                class="status"
            >

                <div class="spinner"></div>

                <strong>
                    Searching for driver...
                </strong>

                <div class="small">
                    Nearby driver ko search kiya ja raha hai
                </div>

            </div>


            <div
                id="driverCard"
                class="driver-card"
            >

                <div class="success">
                    Driver found!
                </div>

                <div class="driver-title">
                    YOUR DRIVER
                </div>

                <div
                    id="driverName"
                    class="driver-name"
                >
                    Rahul Kumar
                </div>

                <div
                    id="driverInfo"
                    class="driver-info"
                >
                    Bike<br>
                    JH01AB1234<br>
                    ⭐ 4.8
                </div>

            </div>

        </div>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://ridemini.onrender.com";


let selectedRide = "Bike";

let distanceKm = 0;

let fareAmount = 0;

let discount = 0;

let currentRideId = null;

let pollingTimer = null;


/* Telegram Mini App */

if(
    window.Telegram &&
    window.Telegram.WebApp
){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}


/* Select Bike / Auto / Cab */

function selectRide(type, element){

    selectedRide = type;

    document
        .querySelectorAll(".ride")
        .forEach(function(item){

            item.classList.remove("active");

        });

    element.classList.add("active");

    calculateFare();

}


/* Current Location */

function useMyLocation(){

    if(!navigator.geolocation){

        alert(
            "Your browser does not support location."
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            document.getElementById(
                "pickup"
            ).value =
                "Current Location";

            alert(
                "Location detected successfully!"
            );

        },

        function(){

            alert(
                "Location permission allow karo."
            );

        }

    );

}


/* Calculate Route */

async function calculateRoute(){

    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();

    const drop =
        document.getElementById(
            "drop"
        ).value.trim();


    if(!pickup){

        alert(
            "Pickup location enter karo."
        );

        return;
    }


    if(!drop){

        alert(
            "Drop location enter karo."
        );

        return;
    }


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                encodeURIComponent(drop)
            );


        const data =
            await response.json();


        if(
            data &&
            data.length > 0
        ){

            /*
              Demo road distance.
              Backend booking system is real,
              map provider can be upgraded later.
            */

            distanceKm =
                Math.floor(
                    Math.random() * 8
                ) + 3;

        }else{

            distanceKm = 5;

        }


        document.getElementById(
            "distance"
        ).innerText =
            distanceKm + " km";


        calculateFare();


        alert(
            "Distance calculated: " +
            distanceKm +
            " km"
        );


    }catch(error){

        distanceKm = 5;

        document.getElementById(
            "distance"
        ).innerText =
            distanceKm + " km";

        calculateFare();

    }

}


/* Fare Calculation */

function calculateFare(){

    let base = 0;

    let perKm = 0;


    if(
        selectedRide === "Bike"
    ){

        base = 40;
        perKm = 9;

    }

    else if(
        selectedRide === "Auto"
    ){

        base = 60;
        perKm = 12;

    }

    else{

        base = 100;
        perKm = 16;

    }


    fareAmount =
        base +
        (distanceKm * perKm) -
        discount;


    if(fareAmount < 0){

        fareAmount = 0;

    }


    document.getElementById(
        "fare"
    ).innerText =
        "₹" +
        Math.round(fareAmount);

}


/* Coupon */

function applyCoupon(){

    const code =
        document
        .getElementById("coupon")
        .value
        .trim()
        .toUpperCase();


    discount = 0;


    if(code === "WELCOME50"){

        discount = 50;

        document.getElementById(
            "couponMessage"
        ).innerText =
            "₹50 discount applied!";

    }

    else if(code === "RIDE20"){

        discount = 20;

        document.getElementById(
            "couponMessage"
        ).innerText =
            "₹20 discount applied!";

    }

    else if(code === "FIRST100"){

        discount = 100;

        document.getElementById(
            "couponMessage"
        ).innerText =
            "₹100 discount applied!";

    }

    else{

        document.getElementById(
            "couponMessage"
        ).innerText =
            "Invalid coupon";

    }


    calculateFare();

}


/* Book Ride */

async function bookRide(){

    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();

    const drop =
        document.getElementById(
            "drop"
        ).value.trim();


    const bookBtn =
        document.getElementById(
            "bookBtn"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "none";


    if(!pickup){

        showError(
            "Pickup location enter karo."
        );

        return;

    }


    if(!drop){

        showError(
            "Drop location enter karo."
        );

        return;

    }


    if(distanceKm <= 0){

        showError(
            "Pehle Calculate Distance karo."
        );

        return;

    }


    bookBtn.disabled = true;

    bookBtn.innerText =
        "Booking...";


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ride",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        pickup:
                            pickup,

                        drop_location:
                            drop,

                        ride_type:
                            selectedRide,

                        distance_km:
                            distanceKm,

                        fare:
                            Math.round(
                                fareAmount
                            )

                    })

                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Booking failed"
            );

        }


        currentRideId =
            data.ride_id;


        document.getElementById(
            "searchStatus"
        ).style.display =
            "block";


        document.getElementById(
            "driverCard"
        ).style.display =
            "none";


        bookBtn.innerText =
            "Searching Driver...";


        /*
          Backend ko har 2 second
          mein check karenge.
        */

        startDriverPolling();


    }catch(error){

        console.error(error);

        showError(
            "Booking failed. Server check karo."
        );

        bookBtn.disabled =
            false;

        bookBtn.innerText =
            "Book Ride";

    }

}


/* Driver Polling */

function startDriverPolling(){

    if(pollingTimer){

        clearInterval(
            pollingTimer
        );

    }


    checkDriverStatus();


    pollingTimer =
        setInterval(
            checkDriverStatus,
            2000
        );

}


/* Check Driver */

async function checkDriverStatus(){

    if(!currentRideId){

        return;

    }


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ride/" +
                currentRideId
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !data.ride
        ){

            return;

        }


        const ride =
            data.ride;


        console.log(
            "Ride status:",
            ride.status
        );


        if(
            ride.status === "accepted" &&
            ride.driver
        ){

            showDriver(
                ride.driver
            );

        }

    }catch(error){

        console.log(
            "Driver status check failed"
        );

    }

}


/* Show Driver */

function showDriver(driver){

    if(pollingTimer){

        clearInterval(
            pollingTimer
        );

        pollingTimer = null;

    }


    document.getElementById(
        "searchStatus"
    ).style.display =
        "none";


    document.getElementById(
        "driverCard"
    ).style.display =
        "block";


    document.getElementById(
        "driverName"
    ).innerText =
        driver.name;


    document.getElementById(
        "driverInfo"
    ).innerHTML =

        driver.vehicle +
        "<br>" +

        driver.vehicleNumber +
        "<br>" +

        "⭐ " +
        driver.rating;


    const bookBtn =
        document.getElementById(
            "bookBtn"
        );


    bookBtn.disabled =
        false;


    bookBtn.innerText =
        "Ride Confirmed";

}


/* Error */

function showError(message){

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.innerText =
        message;


    errorBox.style.display =
        "block";

}

</script>

</body>
</html>
