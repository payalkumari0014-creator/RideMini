<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RideMini</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
}

.app{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    background:white;
    padding-bottom:30px;
}

.header{
    background:#111;
    color:white;
    padding:22px 20px;
    border-radius:0 0 25px 25px;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-top:6px;
    color:#bbb;
    font-size:14px;
}

.card{
    margin:16px;
    padding:18px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
    margin-bottom:13px;
}

input:focus{
    border-color:#111;
}

.location-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:12px;
    background:#eee;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:15px;
}

.map{
    height:180px;
    border-radius:18px;
    background:
        linear-gradient(45deg,#eee 25%,transparent 25%),
        linear-gradient(-45deg,#eee 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eee 75%),
        linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:40px 40px;
    background-position:0 0,0 20px,20px -20px,-20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    color:#555;
    margin-bottom:15px;
}

.route-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.vehicles{
    display:flex;
    gap:10px;
}

.vehicle{
    flex:1;
    padding:15px 8px;
    border:1px solid #ddd;
    border-radius:15px;
    background:white;
    cursor:pointer;
    text-align:center;
}

.vehicle.active{
    background:#111;
    color:white;
    border-color:#111;
}

.vehicle-icon{
    font-size:27px;
    display:block;
    margin-bottom:5px;
}

.vehicle-name{
    font-weight:bold;
    font-size:14px;
}

.fare{
    margin-top:18px;
    padding:16px;
    background:#f5f5f5;
    border-radius:15px;
}

.fare-row{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
}

.fare-total{
    font-size:21px;
    font-weight:bold;
    border-top:1px solid #ddd;
    padding-top:12px;
    margin-top:10px;
}

.coupon-box{
    display:flex;
    gap:8px;
}

.coupon-box input{
    margin:0;
}

.coupon-btn{
    border:0;
    background:#111;
    color:white;
    border-radius:12px;
    padding:0 18px;
    font-weight:bold;
}

.book-btn{
    width:calc(100% - 32px);
    margin:0 16px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    display:none;
    margin:16px;
    padding:20px;
    border-radius:20px;
    background:#111;
    color:white;
}

.status-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.loader{
    margin:15px 0;
    padding:13px;
    border-radius:12px;
    background:#222;
}

.driver{
    display:none;
    margin-top:15px;
    padding:16px;
    background:#222;
    border-radius:15px;
}

.driver-name{
    font-size:19px;
    font-weight:bold;
}

.driver-info{
    margin-top:7px;
    color:#ccc;
    line-height:1.6;
}

.cancel-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:1px solid #555;
    border-radius:12px;
    background:transparent;
    color:white;
}

.success{
    color:#7CFF9B;
}

.error{
    color:#ff7777;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🚕 RideMini</div>
        <div class="subtitle">Ride anywhere, anytime</div>
    </div>


    <!-- LOCATION -->

    <div class="card">

        <label>📍 Pickup Location</label>

        <input
            id="pickup"
            type="text"
            placeholder="Enter pickup location"
        >

        <button
            class="location-btn"
            onclick="useMyLocation()"
        >
            📍 Use My Location
        </button>


        <label>🏁 Drop Location</label>

        <input
            id="drop"
            type="text"
            placeholder="Enter destination"
        >


        <div class="map">
            🗺️ Route Map
        </div>


        <button
            class="route-btn"
            onclick="calculateRoute()"
        >
            Calculate Route
        </button>

    </div>


    <!-- VEHICLES -->

    <div class="card">

        <label>Select Ride</label>

        <div class="vehicles">

            <button
                class="vehicle active"
                id="bike"
                onclick="selectVehicle('Bike')"
            >
                <span class="vehicle-icon">🏍️</span>
                <span class="vehicle-name">Bike</span>
            </button>


            <button
                class="vehicle"
                id="auto"
                onclick="selectVehicle('Auto')"
            >
                <span class="vehicle-icon">🛺</span>
                <span class="vehicle-name">Auto</span>
            </button>


            <button
                class="vehicle"
                id="cab"
                onclick="selectVehicle('Cab')"
            >
                <span class="vehicle-icon">🚕</span>
                <span class="vehicle-name">Cab</span>
            </button>

        </div>


        <div class="fare">

            <div class="fare-row">
                <span>Distance</span>
                <strong id="distance">0 km</strong>
            </div>

            <div class="fare-row">
                <span>Base Fare</span>
                <strong id="baseFare">₹0</strong>
            </div>

            <div class="fare-row">
                <span>Coupon Discount</span>
                <strong id="discount">₹0</strong>
            </div>

            <div class="fare-row fare-total">
                <span>Total</span>
                <strong id="totalFare">₹0</strong>
            </div>

        </div>

    </div>


    <!-- COUPON -->

    <div class="card">

        <label>🎟️ Coupon Code</label>

        <div class="coupon-box">

            <input
                id="coupon"
                type="text"
                placeholder="Enter coupon"
            >

            <button
                class="coupon-btn"
                onclick="applyCoupon()"
            >
                Apply
            </button>

        </div>

    </div>


    <!-- BOOK -->

    <button
        class="book-btn"
        onclick="bookRide()"
    >
        🚕 Book Ride
    </button>


    <!-- STATUS -->

    <div class="status" id="statusBox">

        <div
            class="status-title"
            id="statusTitle"
        >
            Searching for driver...
        </div>

        <div
            class="loader"
            id="statusMessage"
        >
            🔎 Finding nearby driver...
        </div>


        <div
            class="driver"
            id="driverBox"
        >

            <div class="driver-name" id="driverName">
                Driver Found
            </div>

            <div
                class="driver-info"
                id="driverInfo"
            >
            </div>

        </div>


        <button
            class="cancel-btn"
            onclick="cancelRide()"
        >
            Cancel Ride
        </button>

    </div>

</div>


<script>

/* =========================================
   BACKEND
========================================= */

const BACKEND_URL =
    "https://ridemini.onrender.com";


/* =========================================
   VARIABLES
========================================= */

let selectedVehicle = "Bike";

let distanceKm = 0;

let currentFare = 0;

let couponDiscount = 0;

let currentRideId = null;

let ridePolling = null;


/* =========================================
   TELEGRAM
========================================= */

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();
}


/* =========================================
   CURRENT LOCATION
========================================= */

function useMyLocation(){

    if (!navigator.geolocation){

        alert(
            "Browser location support nahi karta."
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            document.getElementById("pickup").value =
                "Current Location";


            console.log(
                "Pickup coordinates:",
                lat,
                lon
            );


            alert(
                "📍 Current location set ho gayi!"
            );
        },

        function(){

            alert(
                "Location permission allow karo."
            );
        }
    );
}


/* =========================================
   VEHICLE
========================================= */

function selectVehicle(type){

    selectedVehicle = type;


    document
        .querySelectorAll(".vehicle")
        .forEach(function(button){

            button.classList.remove("active");

        });


    if(type === "Bike"){

        document
            .getElementById("bike")
            .classList.add("active");

    }

    if(type === "Auto"){

        document
            .getElementById("auto")
            .classList.add("active");

    }

    if(type === "Cab"){

        document
            .getElementById("cab")
            .classList.add("active");

    }


    calculateFare();
}


/* =========================================
   ROUTE
========================================= */

async function calculateRoute(){

    const pickup =
        document.getElementById("pickup").value.trim();

    const drop =
        document.getElementById("drop").value.trim();


    if(!pickup || !drop){

        alert(
            "Pickup aur drop dono enter karo."
        );

        return;
    }


    try{

        /*
        Drop location ko geocode karenge.
        Demo pickup ke liye
        current location use hogi.
        */

        const query =
            encodeURIComponent(drop);


        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?format=json&q="
                + query
            );


        const data =
            await response.json();


        if(!data.length){

            alert(
                "Drop location nahi mili."
            );

            return;
        }


        /*
        Demo distance calculation.
        */

        distanceKm =
            Math.max(
                1,
                Math.round(
                    Math.random() * 8 + 2
                )
            );


        document.getElementById("distance")
            .innerText =
            distanceKm + " km";


        calculateFare();


        alert(
            "Route calculate ho gaya: "
            + distanceKm
            + " km"
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Route calculate nahi ho paya."
        );
    }
}


/* =========================================
   FARE
========================================= */

function calculateFare(){

    let base = 0;

    let perKm = 0;


    if(selectedVehicle === "Bike"){

        base = 40;

        perKm = 9;
    }


    if(selectedVehicle === "Auto"){

        base = 60;

        perKm = 12;
    }


    if(selectedVehicle === "Cab"){

        base = 100;

        perKm = 16;
    }


    let fare =
        base +
        (distanceKm * perKm);


    couponDiscount =
        Math.min(
            couponDiscount,
            fare
        );


    currentFare =
        Math.max(
            0,
            fare - couponDiscount
        );


    document.getElementById("baseFare")
        .innerText =
        "₹" + fare;


    document.getElementById("discount")
        .innerText =
        "₹" + couponDiscount;


    document.getElementById("totalFare")
        .innerText =
        "₹" + currentFare;
}


/* =========================================
   COUPON
========================================= */

function applyCoupon(){

    const code =
        document
        .getElementById("coupon")
        .value
        .trim()
        .toUpperCase();


    couponDiscount = 0;


    if(code === "WELCOME50"){

        couponDiscount = 50;

        alert(
            "🎉 WELCOME50 applied!"
        );

    }
    else if(code === "RIDE20"){

        couponDiscount = 20;

        alert(
            "🎉 RIDE20 applied!"
        );

    }
    else if(code === "FIRST100"){

        couponDiscount = 100;

        alert(
            "🎉 FIRST100 applied!"
        );

    }
    else if(code){

        alert(
            "❌ Invalid coupon"
        );
    }


    calculateFare();
}


/* =========================================
   BOOK RIDE
========================================= */

async function bookRide(){

    const pickup =
        document.getElementById("pickup")
        .value
        .trim();


    const drop =
        document.getElementById("drop")
        .value
        .trim();


    if(!pickup || !drop){

        alert(
            "Pickup aur drop enter karo."
        );

        return;
    }


    if(distanceKm <= 0){

        alert(
            "Pehle Calculate Route karo."
        );

        return;
    }


    const statusBox =
        document.getElementById("statusBox");


    statusBox.style.display = "block";


    document.getElementById("statusTitle")
        .innerText =
        "Searching for driver...";


    document.getElementById("statusMessage")
        .innerText =
        "🔎 Nearby "
        + selectedVehicle
        + " driver ko request bheji ja rahi hai...";


    document.getElementById("driverBox")
        .style.display = "none";


    try{

        const response =
            await fetch(
                BACKEND_URL + "/api/ride",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        pickup:pickup,

                        drop_location:drop,

                        ride_type:selectedVehicle,

                        distance_km:distanceKm,

                        fare:currentFare

                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Booking failed"
            );
        }


        currentRideId =
            data.ride_id;


        console.log(
            "Ride ID:",
            currentRideId
        );


        startRidePolling();


    }
    catch(error){

        console.error(error);

        document.getElementById("statusTitle")
            .innerText =
            "❌ Booking Failed";


        document.getElementById("statusMessage")
            .innerText =
            error.message;
    }
}


/* =========================================
   POLL RIDE STATUS
========================================= */

function startRidePolling(){

    if(ridePolling){

        clearInterval(
            ridePolling
        );
    }


    checkRideStatus();


    ridePolling =
        setInterval(
            checkRideStatus,
            3000
        );
}


/* =========================================
   CHECK RIDE
========================================= */

async function checkRideStatus(){

    if(!currentRideId){

        return;
    }


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/ride/" +
                currentRideId
            );


        const data =
            await response.json();


        if(!data.success){

            return;
        }


        const ride =
            data.ride;


        console.log(
            "Ride status:",
            ride.status
        );


        /* SEARCHING */

        if(
            ride.status === "searching"
        ){

            document
                .getElementById("statusTitle")
                .innerText =
                "🔎 Searching for driver...";


            document
                .getElementById("statusMessage")
                .innerText =
                "Nearby "
                + ride.ride_type
                + " drivers ko request bheji gayi hai.";
        }


        /* ACCEPTED */

        if(
            ride.status === "accepted"
        ){

            showDriverFound(
                ride
            );


            clearInterval(
                ridePolling
            );
        }


        /* REJECTED */

        if(
            ride.status === "rejected"
        ){

            document
                .getElementById("statusTitle")
                .innerText =
                "Ride cancelled";


            document
                .getElementById("statusMessage")
                .innerText =
                "Ride request reject ho gayi.";

            clearInterval(
                ridePolling
            );
        }

    }
    catch(error){

        console.error(
            "Status error:",
            error
        );
    }
}


/* =========================================
   DRIVER FOUND
========================================= */

function showDriverFound(ride){

    document
        .getElementById("statusTitle")
        .innerHTML =
        '<span class="success">✅ Driver Found!</span>';


    document
        .getElementById("statusMessage")
        .innerText =
        "Driver aapki ride accept kar chuka hai.";


    const driver =
        ride.driver;


    if(!driver){

        return;
    }


    document
        .getElementById("driverBox")
        .style.display =
        "block";


    document
        .getElementById("driverName")
        .innerText =
        "👨‍✈️ " +
        driver.name;


    document
        .getElementById("driverInfo")
        .innerHTML =

        "🚗 Vehicle: " +
        driver.vehicle_type +

        "<br>" +

        "🔢 Number: " +
        driver.vehicle_number +

        "<br>" +

        "⭐ Rating: " +
        driver.rating;
}


/* =========================================
   CANCEL
========================================= */

function cancelRide(){

    if(ridePolling){

        clearInterval(
            ridePolling
        );
    }


    currentRideId = null;


    document
        .getElementById("statusBox")
        .style.display =
        "none";


    alert(
        "Ride request cancel kar di gayi."
    );
}


/* =========================================
   INITIAL FARE
========================================= */

calculateFare();

</script>

</body>
</html>
