<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideMini</title>

<style>
*{
    box-sizing:border-box;

}

body{
    background:#f5f5f5;
    color:#111;
}

header{
    background:#000;
    color:#fff;

    font-weight:bold;
}

.container{

}

.card{
    background:#fff;
    border-radius:18px;

}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;

    font-size:15px;
}

button{

.gray{

    color:#111;
}

    margin-bottom:10px;
}

.hidden{

}

.otp-box{

}

.otp-display{

}

.timer{

    color:#666;
}

.vehicle-row{
    display:flex;
    gap:10px;
}

.vehicle{

    text-align:center;
    cursor:pointer;

}

.vehicle.active{
    background:#000;
    color:#fff;
}

.map{
    height:220px;
    border-radius:15px;
    background:
        linear-gradient(45deg,#ddd 25%,transparent 25%),
        linear-gradient(-45deg,#ddd 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#ddd 75%),
        linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size:40px 40px;
    background-position:0 0,0 20px,20px -20px,-20px 0;
    position:relative;
    overflow:hidden;
    margin-top:12px;
}

.road{
    position:absolute;
    width:120%;
    height:8px;
    background:#777;
    top:50%;
    left:-10%;
    transform:rotate(-15deg);
}

.dot{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#000;
    border:4px solid #fff;
    box-shadow:0 2px 8px #555;
}

.pick-dot{
    left:25%;
    top:65%;
}

.drop-dot{
    right:20%;
    top:30%;
}

.route-info{
    margin-top:12px;
    padding:12px;
    background:#f5f5f5;
    border-radius:12px;
}

.fare{
    font-size:30px;
    font-weight:bold;
    margin:10px 0;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

.suggestion{
    background:#fafafa;
    border:1px solid #eee;
    padding:12px;
    cursor:pointer;
}

.suggestion:hover{
    background:#eee;
}

.driver-card{
    border:1px solid #ddd;
    border-radius:15px;
    padding:15px;
    margin-top:12px;
}

.history-item{
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.small{
    font-size:13px;
    color:#666;
}

.rating button{
    background:#eee;
    margin:3px;
}

.rating button.selected{
    background:#000;
    color:#fff;
}

.logout{
    width:100%;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

        >
            📍 Use My Location

        <div class="map">

            <div class="road"></div>

            <div class="dot pick-dot"></div>

            <div class="dot drop-dot"></div>

        </div>

        <div

        </div>

    <!-- VEHICLE -->
    <div class="card">

                🏍️<br>
                Bike

            >
                🛺<br>
                Auto

                id="cab"

                🚕<br>

    </div>


    <!-- COUPON -->
    <div class="card">

        <h2>🎟️ Coupon</h2>

        <input

        <button

            Apply Coupon
        </button>

    </div>


    <!-- FARE -->
    <div class="card">

        <h2>💰 Fare Estimate</h2>

        <div id="fare" class="fare">
            ₹0
        </div>

        <button

            onclick="bookRide()"

            Book Ride
        </button>

        <p id="bookingMessage"></p>

    </div>


    <!-- ACTIVE RIDE -->
    <div
        id="rideSection"

        <h2>🚕 Your Ride</h2>

        <div id="rideStatus">

        </div>

        <h2>📜 Ride History</h2>

        <div id="history">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

const API = "https://ridemini.onrender.com";

let customer = null;
let otp = null;
let otpExpiry = 0;
let resendAvailable = 0;
let otpAttempts = 0;

let pickupCoords = null;
let dropCoords = null;

let selectedVehicle = "Bike";
let selectedCoupon = "";
let currentRide = null;
let selectedRating = 0;

let otpInterval = null;
let rideInterval = null;


// ===============================
// START APP
// ===============================

window.onload = function(){

    try{
        if(window.Telegram &&
           window.Telegram.WebApp){

            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();

        }
    }catch(e){}

    const saved =
        localStorage.getItem("ridemini_customer");

    if(saved){

        try{

            customer = JSON.parse(saved);

            showApp();

        }catch(e){

            localStorage.removeItem(
                "ridemini_customer"
            );

        }

    }

};


// ===============================
// OTP
// ===============================

function sendOTP(){

    const name =
        document.getElementById("name")
        .value.trim();

    const phone =
        document.getElementById("phone")
        .value.trim();

    if(!name){

        alert("Please enter your name");

        return;

    }

    if(!/^[6-9][0-9]{9}$/.test(phone)){

        alert("Invalid Indian mobile number");

        return;

    }

    otp =
        Math.floor(
            100000 +
            Math.random() * 900000
        ).toString();

    otpExpiry =
        Date.now() + 5 * 60 * 1000;

    resendAvailable =
        Date.now() + 30 * 1000;

    otpAttempts = 0;

    document.getElementById(
        "otpSection"
    ).classList.remove("hidden");

    document.getElementById(
        "otpDisplay"
    ).innerText =
        "OTP: " + otp;

    document.getElementById(
        "otpInput"
    ).value = "";

    document.getElementById(
        "otpMessage"
    ).innerText = "";

    startOtpTimer();

}


// ===============================
// OTP TIMER
// ===============================

function startOtpTimer(){

    clearInterval(otpInterval);

    otpInterval =
        setInterval(function(){

            const now = Date.now();

            const remaining =
                Math.max(
                    0,
                    otpExpiry - now
                );

            const seconds =
                Math.floor(
                    remaining / 1000
                );

            const min =
                String(
                    Math.floor(
                        seconds / 60
                    )
                ).padStart(2,"0");

            const sec =
                String(
                    seconds % 60
                ).padStart(2,"0");

            document.getElementById(
                "otpTimer"
            ).innerText =
                "OTP valid for " +
                min + ":" + sec;

            const resendLeft =
                Math.max(
                    0,
                    resendAvailable - now
                );

            const resendBtn =
                document.getElementById(
                    "resendBtn"
                );

            if(resendLeft <= 0){

                resendBtn.classList
                    .remove("hidden");

                resendBtn.innerText =
                    "Resend OTP";

            }else{

                resendBtn.classList
                    .add("hidden");

            }

            if(remaining <= 0){

                clearInterval(otpInterval);

                document.getElementById(
                    "otpTimer"
                ).innerText =
                    "OTP expired";

            }

        },1000);

}


// ===============================
// VERIFY OTP
// ===============================

async function verifyOTP(){

    const entered =
        document.getElementById(
            "otpInput"
        ).value.trim();

    if(Date.now() > otpExpiry){

        alert("OTP expired. Please resend OTP.");

        return;

    }

    if(otpAttempts >= 5){

        alert(
            "Too many wrong attempts. Please resend OTP."
        );

        return;

    }

    if(entered !== otp){

        otpAttempts++;

        document.getElementById(
            "otpMessage"
        ).innerText =
            "Invalid OTP. Attempts left: " +
            (5 - otpAttempts);

        document.getElementById(
            "otpMessage"
        ).className = "error";

        return;

    }

    clearInterval(otpInterval);

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();

    try{

        const response =
            await fetch(
                API + "/api/customer/register",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        name:name,
                        phone:phone
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Registration failed"
            );

        }

        customer =
            data.customer;

        localStorage.setItem(
            "ridemini_customer",
            JSON.stringify(customer)
        );

        showApp();

    }catch(error){

        alert(
            error.message ||
            "Registration failed"
        );

    }

}


// ===============================
// RESEND OTP
// ===============================

function resendOTP(){

    if(Date.now() < resendAvailable){

        return;

    }

    sendOTP();

}


// ===============================
// SHOW APP
// ===============================

function showApp(){

    document.getElementById(
        "loginSection"
    ).classList.add("hidden");

    document.getElementById(
        "appSection"
    ).classList.remove("hidden");

    document.getElementById(
        "userName"
    ).innerText =
        customer.name || "";

    loadHistory();

    loadSavedRide();

}


// ===============================
// LOGOUT
// ===============================

function logout(){

    localStorage.removeItem(
        "ridemini_customer"
    );

    localStorage.removeItem(
        "ridemini_active_ride"
    );

    location.reload();

}


// ===============================
// VEHICLE
// ===============================

function selectVehicle(type){

    selectedVehicle = type;

    document.querySelectorAll(
        ".vehicle"
    ).forEach(function(el){

        el.classList.remove("active");

    });

    document.getElementById(
        type.toLowerCase()
    ).classList.add("active");

    calculateFare();

}


// ===============================
// LOCATION SEARCH
// ===============================

let searchTimers = {};

function searchLocation(type){

    clearTimeout(
        searchTimers[type]
    );

    searchTimers[type] =
        setTimeout(async function(){

            const input =
                document.getElementById(
                    type
                );

            const query =
                input.value.trim();

            if(query.length < 3){

                document.getElementById(
                    type + "Suggestions"
                ).innerHTML = "";

                return;

            }

            try{

                const url =
                    "https://nominatim.openstreetmap.org/search" +
                    "?format=json" +
                    "&limit=5" +
                    "&countrycodes=in" +
                    "&q=" +
                    encodeURIComponent(query);

                const response =
                    await fetch(url,{
                        headers:{
                            "Accept":
                                "application/json"
                        }
                    });

                const results =
                    await response.json();

                const box =
                    document.getElementById(
                        type +
                        "Suggestions"
                    );

                box.innerHTML = "";

                results.forEach(function(item){

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "suggestion";

                    div.innerText =
                        item.display_name;

                    div.onclick =
                        function(){

                            input.value =
                                item.display_name;

                            const coords = {

                                lat:
                                    parseFloat(
                                        item.lat
                                    ),

                                lng:
                                    parseFloat(
                                        item.lon
                                    )

                            };

                            if(type === "pickup"){

                                pickupCoords =
                                    coords;

                            }else{

                                dropCoords =
                                    coords;

                            }

                            box.innerHTML = "";

                            calculateRoute();

                        };

                    box.appendChild(div);

                });

            }catch(error){

                console.log(error);

            }

        },500);

}


// ===============================
// CURRENT LOCATION
// ===============================

function useCurrentLocation(type){

    if(!navigator.geolocation){

        alert(
            "Location is not supported on this device"
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            const coords = {
                lat:lat,
                lng:lng
            };

            try{

                const response =
                    await fetch(
                        "https://nominatim.openstreetmap.org/reverse" +
                        "?format=json" +
                        "&lat=" + lat +
                        "&lon=" + lng
                    );

                const data =
                    await response.json();

                const address =
                    data.display_name ||
                    "Current Location";

                document.getElementById(
                    type
                ).value = address;

                if(type === "pickup"){

                    pickupCoords =
                        coords;

                }else{

                    dropCoords =
                        coords;

                }

                calculateRoute();

            }catch(error){

                document.getElementById(
                    type
                ).value =
                    lat + ", " + lng;

                if(type === "pickup"){

                    pickupCoords =
                        coords;

                }else{

                    dropCoords =
                        coords;

                }

                calculateRoute();

            }

        },

        function(){

            alert(
                "Location permission denied"
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000
        }

    );

}


// ===============================
// ROUTE
// ===============================

async function calculateRoute(){

    if(!pickupCoords ||
       !dropCoords){

        return;

    }

    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            pickupCoords.lng + "," +
            pickupCoords.lat + ";" +
            dropCoords.lng + "," +
            dropCoords.lat +
            "?overview=false";

        const response =
            await fetch(url);

        const data =
            await response.json();

        if(!data.routes ||
           !data.routes.length){

            return;

        }

        const distance =
            data.routes[0].distance /
            1000;

        const duration =
            data.routes[0].duration /
            60;

        document.getElementById(
            "routeInfo"
        ).classList.remove("hidden");

        document.getElementById(
            "routeInfo"
        ).innerHTML =

            "📏 Distance: <b>" +
            distance.toFixed(2) +
            " km</b><br>" +

            "⏱️ Estimated time: <b>" +
            Math.round(duration) +
            " min</b>";

        window.rideDistance =
            distance;

        calculateFare();

    }catch(error){

        console.log(error);

    }

}


// ===============================
// FARE
// ===============================

function calculateFare(){

    const distance =
        window.rideDistance || 3;

    let base = 0;
    let perKm = 0;

    if(selectedVehicle === "Bike"){

        base = 30;
        perKm = 10;

    }

    if(selectedVehicle === "Auto"){

        base = 40;
        perKm = 13;

    }

    if(selectedVehicle === "Cab"){

        base = 60;
        perKm = 18;

    }

    let total =
        base +
        distance * perKm;

    if(selectedCoupon === "WELCOME50"){

        total =
            Math.max(
                0,
                total - 50
            );

    }

    if(selectedCoupon === "RIDE20"){

        total =
            total * 0.80;

    }

    if(selectedCoupon === "FIRST100"){

        total =
            Math.max(
                0,
                total - 100
            );

    }

    total =
        Math.round(total);

    document.getElementById(
        "fare"
    ).innerText =
        "₹" + total;

}


// ===============================
// COUPON
// ===============================

function applyCoupon(){

    const code =
        document.getElementById(
            "coupon"
        ).value
        .trim()
        .toUpperCase();

    if(
        code === "WELCOME50" ||
        code === "RIDE20" ||
        code === "FIRST100"
    ){

        selectedCoupon = code;

        document.getElementById(
            "couponMessage"
        ).innerText =
            "Coupon applied: " + code;

        document.getElementById(
            "couponMessage"
        ).className =
            "success";

        calculateFare();

    }else{

        selectedCoupon = "";

        document.getElementById(
            "couponMessage"
        ).innerText =
            "Invalid coupon";

        document.getElementById(
            "couponMessage"
        ).className =
            "error";

        calculateFare();

    }

}


// ===============================
// BOOK RIDE
// ===============================

async function bookRide(){

    if(!customer){

        alert("Please login first");

        return;

    }

    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();

    const drop =
        document.getElementById(
            "drop"
        ).value.trim();

    if(!pickup){

        alert("Please enter pickup location");

        return;

    }

    if(!drop){

        alert("Please enter drop location");

        return;

    }

    if(!pickupCoords ||
       !dropCoords){

        alert(
            "Please select pickup and drop location from suggestions or use current location"
        );

        return;

    }

    const fareText =
        document.getElementById(
            "fare"
        ).innerText
        .replace("₹","");

    const fare =
        Number(fareText);

    const body = {

        customer_id:
            customer.id,

        pickup:
            pickup,

        drop_location:
            drop,

        ride_type:
            selectedVehicle,

        distance_km:
            window.rideDistance || 3,

        fare:
            fare,

        pickup_lat:
            pickupCoords.lat,

        pickup_lng:
            pickupCoords.lng,

        drop_lat:
            dropCoords.lat,

        drop_lng:
            dropCoords.lng

    };

    try{

        document.getElementById(
            "bookingMessage"
        ).innerText =
            "Booking ride...";

        const response =
            await fetch(
                API + "/api/ride",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Booking failed"
            );

        }

        currentRide =
            data.ride;

        localStorage.setItem(
            "ridemini_active_ride",
            JSON.stringify(
                currentRide
            )
        );

        document.getElementById(
            "rideSection"
        ).classList.remove("hidden");

        document.getElementById(
            "rideStatus"
        ).innerText =
            "🔎 Searching for driver...";

        document.getElementById(
            "bookingMessage"
        ).innerText =
            "Ride booked successfully";

        document.getElementById(
            "bookingMessage"
        ).className =
            "success";

        startRidePolling();

    }catch(error){

        document.getElementById(
            "bookingMessage"
        ).innerText =
            error.message ||
            "Booking failed";

        document.getElementById(
            "bookingMessage"
        ).className =
            "error";

    }

}


// ===============================
// LOAD SAVED RIDE
// ===============================

function loadSavedRide(){

    const saved =
        localStorage.getItem(
            "ridemini_active_ride"
        );

    if(!saved){

        return;

    }

    try{

        currentRide =
            JSON.parse(saved);

        document.getElementById(
            "rideSection"
        ).classList.remove(
            "hidden"
        );

        startRidePolling();

    }catch(error){

        localStorage.removeItem(
            "ridemini_active_ride"
        );

    }

}


// ===============================
// RIDE POLLING
// ===============================

function startRidePolling(){

    clearInterval(
        rideInterval
    );

    if(!currentRide){

        return;

    }

    checkRide();

    rideInterval =
        setInterval(
            checkRide,
            3000
        );

}


// ===============================
// CHECK RIDE
// ===============================

async function checkRide(){

    if(!currentRide){

        return;

    }

    try{

        const response =
            await fetch(
                API +
                "/api/ride/" +
                currentRide.id
            );

        const data =
            await response.json();

        if(!response.ok){

            return;

        }

        currentRide = data.ride;

        localStorage.setItem(
            "ridemini_active_ride",
            JSON.stringify(
                currentRide
            )
        );

        updateRideUI();

    }catch(error){

        console.log(error);

    }

}


// ===============================
// UPDATE RIDE UI
// ===============================

function updateRideUI(){

    if(!currentRide){

        return;

    }

    const status =
        currentRide.status;

    const statusBox =
        document.getElementById(
            "rideStatus"
        );

    const driverBox =
        document.getElementById(
            "driverDetails"
        );

    if(status === "searching"){

        statusBox.innerText =
            "🔎 Searching for nearby driver...";

        driverBox.classList.add(
            "hidden"
        );

    }


    if(
        status === "accepted" ||
        status === "driver_arriving"
    ){

        statusBox.innerText =
            "🚕 Driver is coming to pickup";

        showDriver();

    }


    if(status === "started"){

        statusBox.innerText =
            "🟢 Ride started — driver location is updating";

        showDriver();

    }


    if(status === "completed"){

        statusBox.innerText =
            "✅ Ride completed";

        showDriver();

        document.getElementById(
            "cancelBtn"
        ).classList.add(
            "hidden"
        );

        clearInterval(
            rideInterval
        );

        document.getElementById(
            "ratingSection"
        ).classList.remove(
            "hidden"
        );

    }


    if(status === "cancelled"){

        statusBox.innerText =
            "❌ Ride cancelled";

        clearInterval(
            rideInterval
        );

        localStorage.removeItem(
            "ridemini_active_ride"
        );

    }

}


// ===============================
// DRIVER DETAILS
// ===============================

function showDriver(){

    const driverBox =
        document.getElementById(
            "driverDetails"
        );

    driverBox.classList.remove(
        "hidden"
    );

    const driver =
        currentRide.driver ||
        {};

    let html = "";

    html +=
        "<h3>👨‍✈️ Driver</h3>";

    html +=
        "<p><b>" +
        (driver.name || "Driver") +
        "</b></p>";

    if(driver.vehicle_type){

        html +=
            "<p>🚕 Vehicle: " +
            driver.vehicle_type +
            "</p>";

    }

    if(driver.vehicle_number){

        html +=
            "<p>🔢 Number: " +
            driver.vehicle_number +
            "</p>";

    }

    if(driver.rating){

        html +=
            "<p>⭐ Rating: " +
            driver.rating +
            "</p>";

    }

    if(
        currentRide.driver_lat &&
        currentRide.driver_lng
    ){

        html +=
            "<p>📍 Driver location updating</p>";

        html +=
            "<p class='small'>" +
            currentRide.driver_lat +
            ", " +
            currentRide.driver_lng +
            "</p>";

    }

    driverBox.innerHTML =
        html;

}


// ===============================
// CANCEL RIDE
// ===============================

async function cancelRide(){

    if(!currentRide){

        return;

    }

    if(!confirm(
        "Cancel this ride?"
    )){

        return;

    }

    try{

        const response =
            await fetch(
                API +
                "/api/ride/" +
                currentRide.id +
                "/cancel",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        customer_id:
                            customer.id

                    })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Unable to cancel"
            );

        }

        currentRide =
            data.ride;

        localStorage.removeItem(
            "ridemini_active_ride"
        );

        updateRideUI();

    }catch(error){

        alert(
            error.message ||
            "Unable to cancel ride"
        );

    }

}


// ===============================
// RATING
// ===============================

function setRating(value){

    selectedRating =
        value;

    document.querySelectorAll(
        ".rating button"
    ).forEach(
        function(button,index){

            if(index < value){

                button.classList.add(
                    "selected"
                );

            }else{

                button.classList.remove(
                    "selected"
                );

            }

        }
    );

}


// ===============================
// SUBMIT RATING
// ===============================

async function submitRating(){

    if(!currentRide){

        return;

    }

    if(selectedRating < 1){

        alert(
            "Please select rating"
        );

        return;

    }

    const review =
        document.getElementById(
            "review"
        ).value.trim();

    try{

        const response =
            await fetch(
                API +
                "/api/ride/" +
                currentRide.id +
                "/rating",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        customer_id:
                            customer.id,

                        rating:
                            selectedRating,

                        review:
                            review

                    })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Rating failed"
            );

        }

        alert(
            "Thank you for rating your driver!"
        );

        document.getElementById(
            "ratingSection"
        ).classList.add(
            "hidden"
        );

        localStorage.removeItem(
            "ridemini_active_ride"
        );

        loadHistory();

    }catch(error){

        alert(
            error.message ||
            "Rating failed"
        );

    }

}


// ===============================
// HISTORY
// ===============================

async function loadHistory(){

    if(!customer){

        return;

    }

    try{

        const response =
            await fetch(
                API +
                "/api/customer/" +
                customer.id +
                "/rides"
            );

        const data =
            await response.json();

        const box =
            document.getElementById(
                "history"
            );

        if(
            !data.rides ||
            data.rides.length === 0
        ){

            box.innerHTML =
                "<p class='small'>No rides yet.</p>";

            return;

        }

        box.innerHTML = "";

        data.rides.forEach(
            function(ride){

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "history-item";

                div.innerHTML =

                    "<b>" +
                    ride.ride_type +
                    "</b> — ₹" +
                    (ride.fare || 0) +

                    "<br>" +

                    "<span class='small'>" +
                    ride.pickup +
                    " → " +
                    ride.drop_location +
                    "</span>" +

                    "<br>" +

                    "<span class='small'>" +
                    "Status: " +
                    ride.status +
                    "</span>";

                box.appendChild(div);

            }
        );

    }catch(error){

        document.getElementById(
            "history"
        ).innerHTML =
            "<p class='error'>Unable to load history</p>";

    }

}

</script>
